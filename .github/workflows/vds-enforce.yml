# VDS enforcement.
#
# VDS S-7(2)(3) requires a gate to be invoked by something OTHER than the author
# choosing to run it, and VDS S-7(3) is explicit that a hook is not CI:
# `git commit --no-verify` bypasses a local hook, and an author with write access
# can edit a gate and re-pin it in the same act (VDS S-8(5) records that residue
# as non-machine).
#
# This job is the TRUST ROOT. It re-runs the same deterministic gates on the
# canonical remote, on a PINNED toolchain, where no --no-verify and no local edit
# can reach. `.vds/enforcement.lock` names this workflow as each gate's blocking
# `ci_workflow` invocation, so `vds doctor` D4 is settled by a fact about this
# file rather than by an intention.
#
# Make this a REQUIRED status check in branch protection, or the verdict is
# advisory and D4 is not met however green it goes.
name: vds-enforce

on:
  push:
  pull_request:

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      # Actions are SHA-PINNED (an immutable commit, not a movable tag) so a
      # re-tagged or compromised action cannot inject code into the trust root.
      # The trailing comment records the human-readable version; bump the SHA
      # deliberately, never by drift.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # The exact toolchain, matching rust-toolchain.toml. A proof is valid only
      # if it is re-runnable and deterministic (VDS S-7(2)(1)), and a moving
      # "stable" channel means a new compiler or lint can silently change what
      # passes.
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Format
        run: cargo fmt --all --check

      # Zero warnings, enforced. On a pinned toolchain this is reproducible, so
      # "no warnings" stops being an honour system.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The failing-direction tests VDS S-7(2)(2) requires live here. Every gate
      # named in .vds/enforcement.lock points at a test in this suite, and
      # `vds lock verify` reports an entry whose named test file is missing.
      - name: Test
        run: cargo test --workspace

      # site-factory is JavaScript, so `cargo test` never touched it and its gate lived
      # only in `make check`. That made the Makefile's own claim false - "the same set the
      # CI trust root runs, in the same order" - and left the ONE tree that was added
      # because it "shipped ungated" enforced by whoever remembered to run make locally.
      # VDS S-7(2)(3) requires invocation by something other than the author choosing to
      # run it, and S-7(3) says a Makefile is not CI.
      #
      # No setup-node step: ubuntu-latest ships Node, and the suite is dependency-free
      # (node:test only, no package.json under site-factory/). Adding an action here would
      # need a SHA pin per the convention above; not needing one is better.
      - name: site-factory gate
        run: node site-factory/tests/gate.js

      - name: Build
        run: cargo build --release --bin vds

      # The schemas are GENERATED from the Rust types. A type change that is not
      # reflected in the committed schema is drift between the contract and the
      # thing that produces it, which is the defect the derive-don't-store rule
      # exists to prevent.
      - name: Schemas match their types
        run: ./target/release/vds schema check

      # The vendored designpack matches its pin. VDS S-11(3): no doctrine flows
      # downstream by silence.
      - name: Designpack in force
        run: ./target/release/vds pack verify

      # The gates match their digests. VDS S-8(4): drift is fatal.
      - name: Enforcement lock
        run: ./target/release/vds lock verify

      # VDS applied to VDS. The ledger is regenerated first, because a stale
      # ledger is a precondition failure and would report as "did not run"
      # rather than as a finding.
      - name: Regenerate the declared surface
        run: ./target/release/vds ledger screens

      # invoked-by is recorded HONESTLY on every captured record. A record
      # stamped `manual` does not satisfy VDS S-7(2)(3), and stamping this run
      # as anything else would be a false statement of the record.
      #
      # --allow-vacuous IS SPECIFIC TO VDS ITSELF. DO NOT COPY IT.
      #
      # VDS is a governance kernel with no screens and no component library, so
      # seven of the ten kinds are legitimately vacuous here and `--all` exits 3. `.vds/config.toml` says which five and why. The flag
      # changes only whether this job BLOCKS: the run is still recorded as
      # `status: vacuous`, still prints the words, and is still not evidence for
      # any warrant (VDS S-7(2)(4)).
      #
      # A subject project must NOT pass this flag. There, a vacuity means the
      # declared surface reached nothing, which is exactly the defect
      # [2026] VJS-CC-OPBOX 3 D3 found: a printed PASS over zero enforceable
      # rows. Letting that through is the whole failure mode.
      - name: Proofs
        run: ./target/release/vds proof --all --invoked-by ci_workflow --allow-vacuous

      # The two kinds that are genuinely enforced against this repository, run
      # WITHOUT the exemption above, so a vacuity in either is a red build.
      - name: The gates that are real here
        run: |
          ./target/release/vds proof no_stored_values --invoked-by ci_workflow
          ./target/release/vds proof ledger_staleness --invoked-by ci_workflow

      # VDS applied to a project that HAS a surface, and the answer to the
      # objection the step above invites: a kernel that can only demonstrate
      # itself on a repository with no screens has demonstrated very little.
      #
      # `examples/storefront` is three screens, six components, two themes and
      # one deprecated record draining to zero. The `--all` line exercises every
      # kind; the loop then re-runs the TEN that are real here with NO exemption,
      # so a vacuity in any of them is a red build rather than a footnote. This is
      # the step that makes `vds doctor` D1, D2 and D3 answerable at all.
      #
      # `token_pin` follows the loop rather than sitting in it, because it needs
      # a pin GENERATED first. That generation is out of band by design: one of
      # the two records it compares is behind a network call VDS S-7(2)(1)
      # forbids inside a proof, so the comparison happens in `vds pin generate`
      # and the gate checks what came out.
      - name: The worked example, with no exemption
        run: |
          ./target/release/vds ledger screens --root examples/storefront
          # The figma ledger, from a response committed outside `.vds/`. Three
          # proofs read it: `states` measures states.drawn against it,
          # `reconciliation` resolves limb (c) against it, and `ledger_staleness`
          # R3 checks it is self-consistent and not older than its readers.
          ./target/release/vds figma pull --root examples/storefront \
            --from examples/storefront/figma/file-SFDEMO.json
          # The SCREEN FRAME ledger, which `screen_parity` reads. Without this line CI
          # trusted a committed frames.yaml it never re-derived, so a stale ledger would
          # have passed - the generated half that nothing regenerates. The proof enforces
          # 3 rows here, measured, and was the one kind absent from the loop below.
          ./target/release/vds figma frames --root examples/storefront \
            --from examples/storefront/figma/frames-SFDEMO.json
          ./target/release/vds proof --all --root examples/storefront --invoked-by ci_workflow --allow-vacuous
          for kind in register_completeness reconciliation composition contrast states \
                      parity retirement_drain ledger_staleness no_stored_values \
                      screen_parity; do
            ./target/release/vds proof "$kind" --root examples/storefront --invoked-by ci_workflow
          done
          # The tenth kind. The pin is regenerated from a response committed
          # outside `.vds/` and then checked, which is two acts: generating
          # proves the derivation still runs against the shipped stylesheet,
          # checking proves the two named records still agree.
          ./target/release/vds pin generate --root examples/storefront --file-key SFDEMO \
            --from examples/storefront/figma/variables-export.json \
            --subject "the storefront palette and spacing"
          ./target/release/vds proof token_pin --root examples/storefront --invoked-by ci_workflow

      # The honest position, printed on every run so a regression in a criterion
      # is visible in the log rather than discovered at a review.
      - name: Doctor
        run: ./target/release/vds doctor --report-only
