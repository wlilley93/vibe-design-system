notes:
- '[reach] this run establishes that each registered screen''s required arrangement is the one its AUTHORITATIVE FRAME draws, in the decided-target file, as of the capture the frame ledger was derived from. It does NOT establish what the code renders. Counting a route''s columns from its source means parsing the subject''s own layout components, and there is no general answer to that: in the subject this was derived from it took an AST pass over one component''s three pane props PLUS the rails contributed by every enclosing layout, and both halves were defects before they were features. A subject that can read its own arrangement supplies an `ArrangementSource` and the same rules run over it. Until it does, a pass here is a pass about the FRAME, and saying so is the point: three separate numbers in the subject were reported as parity and none of them was.'
- '[exclusions] a screen is EXCLUDED only where the DESIGN states nothing to measure against, and an exclusion is never a pass. Two things qualify: a screen the register has not put in an enforceable status, and a frame that DISCLAIMS ITSELF, meaning its authoritative layer says in its own name that it is not source-current or was never built (25 of 188 frames in the subject did this). Everything else this run could not measure is UNSCORED and carries a fatal finding, including a reading taken at the capture boundary: bytes that cannot distinguish "draws nothing here" from "we did not look" are not a reading, the prior art recorded the first as a fact about one of the two busiest routes in the product, and the truth was the second.'
- '[source] read from the frame ledger, captured from file SFDEMO at depth 4'
- '1 frame(s) in the capture are claimed by no screen record. A screen drawn in the decided-target file and absent from the register is one design has committed to and governance has never seen (VDS S-5(6)). They are NOT rows: nothing was enforced against them, so counting them would raise rows_enforced for nothing.'
- '[coverage] 3 of 4 registered screen(s) were SCORED (75%). 0 UNSCORED: a requirement exists and this run could not measure it, which is a finding and never a pass. 1 EXCLUDED: the design states nothing to measure against, which is a different fact from the code being wrong.'
