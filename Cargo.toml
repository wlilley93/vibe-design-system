[workspace]
resolver = "3"
members = [
    "crates/vds-core",
    "crates/vds-designpack",
    "crates/vds-store",
    "crates/vds-scan",
    "crates/vds-css",
    "crates/vds-figma",
    "crates/vds-proof",
    "crates/vds-cli",
    "crates/vds-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["wlilley93"]
repository = "https://github.com/wlilley93/vibe-design-system"

[workspace.dependencies]
vds-core = { path = "crates/vds-core" }
vds-designpack = { path = "crates/vds-designpack" }
vds-store = { path = "crates/vds-store" }
vds-scan = { path = "crates/vds-scan" }
vds-css = { path = "crates/vds-css" }
vds-figma = { path = "crates/vds-figma" }
vds-proof = { path = "crates/vds-proof" }
vds-testkit = { path = "crates/vds-testkit" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
walkdir = "2"
schemars = "0.8"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true

# The preimage limb of `no_stored_values` (VDS S-2(8) limb 2) enumerates about 65
# million candidate strings and digests each one. Unoptimised, that is five
# minutes and `cargo test` becomes something nobody runs; optimised it is a
# fraction of a second. So these four packages carry optimisation into the debug
# profile too.
#
# This is not a convenience. A gate whose cost makes it unrunnable during
# development is a gate that gets commented out, and a commented-out gate is the
# state VDS S-1(4) records as the origin of both founding defects. The rest of the
# workspace stays unoptimised and debuggable.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.md-5]
opt-level = 3
[profile.dev.package.vds-proof]
opt-level = 3
