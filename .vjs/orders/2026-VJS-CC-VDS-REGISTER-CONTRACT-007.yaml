runtime_summary: >
  The register is canonical; the binding grows a recorded code side limited to what is
  underivable, each recorded field paired with a proof limb that compares it to the scan
  (the CC-VDS-2 template generalised). Cut-over, CEM, and any second authority are
  forbidden. The sync boundary is dissolved as superseded by structure: decided in Figma,
  contracted in the register, realised in code, every crossing a measured parity.
