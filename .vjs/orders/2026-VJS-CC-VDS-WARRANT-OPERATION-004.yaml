runtime_summary: >
  W1 may be granted over a declared subset named by digest; widening is a new grant. W2 is
  referred to the bench with the proofs as case file - machine evidence lowers the cost of
  a sitting, never replaces it. A designpack binds exactly the project whose config pins
  it; fleet consistency is shared pins made visible, never one binding pin.
