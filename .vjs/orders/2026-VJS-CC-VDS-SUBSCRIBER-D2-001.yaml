runtime_summary: >
  D2 has two seats. Kernel: five limbs over gate source. Subscriber: pin the released
  binary and resolve transitively through its kernel provenance; absent provenance,
  NOT CHECKED with the missing link named. Doctor names the seat. The worked example pins
  the binary it runs, never kernel paths.
