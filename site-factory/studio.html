<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>site-factory studio</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #0d0d10; --panel: #15151a; --raised: #1c1c23; --line: #2a2a33;
    --ink: #eceef2; --muted: #8b8b99; --dim: #5f5f6d;
    --accent: #6c8cff; --good: #4ec9a0; --bad: #ff7a7a;
    --r: 7px;
  }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    background: var(--bg); color: var(--ink);
    font: 13.5px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  button { font: inherit; cursor: pointer; }

  /* ── top bar ───────────────────────────────────────────────── */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--panel);
    flex-shrink: 0;
  }
  .brand { font-size: 13px; font-weight: 650; letter-spacing: .2px; }
  .brand em { color: var(--muted); font-style: normal; font-weight: 400; }
  .tag { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--raised); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
  .tag.on { color: var(--good); border-color: rgba(78,201,160,.5); }
  .strip { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
  .strip i { width: 20px; height: 20px; display: block; }
  .grow { flex: 1; }

  main { flex: 1; display: flex; min-height: 0; }

  /* ── left: the sheet ──────────────────────────────────────── */
  .sheet { width: 430px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); min-height: 0; }

  .brief { padding: 12px 14px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .brief .lbl { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .07em; margin: 7px 0 3px; }
  .brief .lbl:first-child { margin-top: 0; }
  .brief input, .brief textarea, .brief select {
    width: 100%; background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: var(--r); padding: 6px 8px; font: inherit; font-size: 12.5px;
  }
  .brief textarea { resize: vertical; min-height: 44px; }
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actions { display: flex; gap: 6px; margin-top: 9px; }
  .btn { padding: 5px 10px; border-radius: var(--r); background: var(--raised); color: var(--ink); border: 1px solid var(--line); font-size: 12px; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.solid { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.solid:hover { color: #fff; filter: brightness(1.08); }

  /* layer stepper */
  .stepper { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .stepper .title { flex: 1; font-size: 12.5px; font-weight: 600; }
  .stepper .count { font-size: 11px; color: var(--dim); }
  .dots { display: flex; gap: 3px; padding: 0 14px 9px; flex-wrap: wrap; flex-shrink: 0; }
  .dot { height: 3px; flex: 1; min-width: 12px; border-radius: 2px; background: var(--line); cursor: pointer; }
  .dot.on { background: var(--accent); }
  .dot.done { background: var(--dim); }

  .fields { flex: 1; overflow-y: auto; min-height: 0; padding-bottom: 20px; }
  .src { padding: 8px 14px 2px; font-size: 10.5px; color: var(--dim); font-style: italic; line-height: 1.4; }

  .f { padding: 8px 14px; border-left: 2px solid transparent; }
  .f.sel { background: rgba(108,140,255,.06); border-left-color: var(--accent); }
  .f .k { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 4px; }
  .car { display: flex; align-items: center; gap: 6px; }
  .ar {
    width: 24px; height: 24px; flex-shrink: 0; border-radius: 5px; padding: 0;
    background: var(--raised); color: var(--ink); border: 1px solid var(--line);
    font-size: 11px; line-height: 1; display: grid; place-items: center;
  }
  .ar:hover { border-color: var(--accent); color: var(--accent); }
  .v {
    flex: 1; text-align: center; font-size: 12.5px; padding: 4px 6px; min-width: 0;
    background: var(--bg); border: 1px solid var(--line); border-radius: 5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .n { font-size: 10px; color: var(--dim); min-width: 28px; text-align: right; flex-shrink: 0; }
  .f input[type=text], .f input[type=number] {
    width: 100%; background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 5px; padding: 5px 7px; font: inherit; font-size: 12.5px;
  }
  .swatch { display: flex; align-items: center; gap: 7px; }
  .swatch input[type=color] { width: 40px; height: 26px; flex-shrink: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 2px; }
  .swatch input[type=text] { flex: 1; font-family: ui-monospace, monospace; font-size: 11.5px; }
  .hint { font-size: 10.5px; color: var(--dim); margin-top: 4px; line-height: 1.45; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font-size: 11px; padding: 3px 7px; border-radius: 5px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.ord { background: var(--raised); border-color: var(--accent); color: var(--accent); }

  /* ── right: stage ─────────────────────────────────────────── */
  .stage { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .bar .st { font-size: 11.5px; color: var(--muted); font-family: ui-monospace, monospace; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .seg button { background: transparent; border: 0; color: var(--muted); padding: 4px 10px; font-size: 12px; }
  .seg button.on { background: var(--raised); color: var(--ink); }
  .wrap { flex: 1; padding: 12px; overflow: auto; min-height: 0; }
  iframe { width: 100%; height: 100%; min-height: 600px; border: 1px solid var(--line); border-radius: 8px; background: #fff; display: block; }
  iframe.narrow { max-width: 400px; margin: 0 auto; }
  .note { margin: 12px; padding: 9px 11px; border-radius: 6px; font-size: 12px; white-space: pre-wrap; font-family: ui-monospace, monospace; line-height: 1.5; }
  .note.err { background: rgba(255,122,122,.1); border: 1px solid rgba(255,122,122,.4); color: var(--bad); }
  .note.ok { background: rgba(78,201,160,.08); border: 1px solid rgba(78,201,160,.35); color: var(--good); }
  kbd { font-family: ui-monospace, monospace; font-size: 10px; background: var(--raised); border: 1px solid var(--line); border-radius: 3px; padding: 1px 4px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <span class="brand">site-factory <em>studio</em></span>
  <span class="strip" id="strip" title="live palette"></span>
  <span class="tag" id="t-route">—</span>
  <span class="tag" id="t-vds">vds</span>
  <span class="grow"></span>
  <span class="tag"><kbd>←</kbd> <kbd>→</kbd> rotate · <kbd>↑</kbd> <kbd>↓</kbd> field · <kbd>tab</kbd> layer</span>
</header>

<main>
  <section class="sheet">
    <div class="brief">
      <div class="lbl">Project name</div>
      <input id="f-name" type="text" value="Northgate Trust">
      <div class="lbl">Tagline</div>
      <input id="f-tag" type="text" value="I draw the structure first.">
      <div class="g2">
        <div>
          <div class="lbl">Route</div>
          <select id="f-cat">
            <option value="marketing-site">marketing-site</option>
            <option value="saas-app">saas-app</option>
          </select>
        </div>
        <div>
          <div class="lbl">Governance</div>
          <select id="f-vds">
            <option value="">ungoverned</option>
            <option value="1">establish .vds/</option>
          </select>
        </div>
      </div>
      <div class="lbl">Brief</div>
      <textarea id="f-desc">A private trust and estate structuring advisory for legal ownership.</textarea>
      <div class="actions">
        <button class="btn solid" id="b-suggest">Suggest all</button>
        <button class="btn" id="b-reroll">Reroll design</button>
      </div>
    </div>

    <div class="stepper">
      <button class="ar" id="b-prev" title="previous layer">◀</button>
      <span class="title" id="l-title">—</span>
      <span class="count" id="l-count">—</span>
      <button class="ar" id="b-next" title="next layer">▶</button>
    </div>
    <div class="dots" id="dots"></div>
    <div class="fields" id="fields"></div>
  </section>

  <section class="stage">
    <div class="bar">
      <span class="seg">
        <button id="b-wide" class="on">Desktop</button>
        <button id="b-narrow">Mobile</button>
      </span>
      <span class="st" id="status">—</span>
      <span class="grow"></span>
      <button class="btn solid" id="b-commit">Create project</button>
    </div>
    <div id="msg"></div>
    <div class="wrap"><iframe id="prev" title="live preview"></iframe></div>
  </section>
</main>

<script>
'use strict';

let SCHEMA = null;
let config = null;
let layerIdx = 0;
let fieldIdx = 0;

const $ = (id) => document.getElementById(id);

/* ── model helpers ──────────────────────────────────────────── */

// Two routes, not one flow with a toggle: the route decides which layers exist.
function layers() {
  const keys = SCHEMA.routes[config.identity.category] || SCHEMA.routes['marketing-site'];
  return SCHEMA.layers.filter((l) => l.key !== 'identity' && keys.includes(l.key));
}
function layer() { return layers()[layerIdx]; }

// Style packs come from disk (GET /schema), so dropping a token file into tokens/
// adds an option here with no change to this file.
function options(layerKey, field) {
  if (layerKey === 'palette' && field.key === 'basePack') return SCHEMA.stylePacks;
  return field.options || [];
}
function rotatable(layerKey, field) {
  return field.type === 'enum' || (layerKey === 'palette' && field.key === 'basePack');
}

async function rotate(dir) {
  const l = layer();
  const f = l.fields[fieldIdx];
  if (!f || !rotatable(l.key, f)) return;
  const opts = options(l.key, f);
  if (!opts.length) return;
  let i = opts.indexOf(config[l.key][f.key]);
  if (i === -1) i = 0;
  const next = opts[(i + dir + opts.length) % opts.length];
  config[l.key][f.key] = next;
  if (l.key === 'palette' && f.key === 'basePack') await applyPack(next);
  drawFields(); schedule();
}

// Rotating the base pack must re-seed the six explicit colour fields and both fonts
// to that pack's REAL values. Without this you switch pack and nothing moves,
// because the colour fields still hold the previous pack's hexes.
const packCache = {};
async function applyPack(pack) {
  if (!packCache[pack]) {
    const r = await fetch('/pack/' + encodeURIComponent(pack));
    if (!r.ok) return;
    packCache[pack] = await r.json();
  }
  const t = packCache[pack];
  Object.assign(config.palette, {
    basePack: pack,
    groundColor: t.colors.bg, surfaceColor: t.colors.surface, inkColor: t.colors.ink,
    accentColor: t.colors.accent, accentInkColor: t.colors.accentInk, borderColor: t.colors.border,
  });
  config.typography.displayFont = t.font.family;
  config.typography.monoFont = t.font.mono;
  config.spacing.spaceUnit = t.space.unit;
}

// Reroll the DESIGN layers only. Identity, voice and strategy are decisions about
// the business, not dice — rerolling them would throw away what was typed.
const DESIGN = { palette: ['basePack'], typography: ['pairingStyle', 'typeScale'], spacing: ['density','cornerRadius','borderWeight','elevation'], imagery: ['imageTreatment','iconStyle'], motion: ['motionIntensity','transitionStyle'] };
async function reroll() {
  for (const [lk, keys] of Object.entries(DESIGN)) {
    const L = SCHEMA.layers.find((x) => x.key === lk);
    if (!L || !config[lk]) continue;
    for (const key of keys) {
      const f = L.fields.find((x) => x.key === key);
      if (!f) continue;
      const opts = options(lk, f);
      if (!opts.length) continue;
      const pick = opts[Math.floor(Math.random() * opts.length)];
      config[lk][key] = pick;
      if (lk === 'palette' && key === 'basePack') await applyPack(pick);
    }
  }
  drawFields(); drawChrome(); schedule();
}

/* ── rendering the sheet ────────────────────────────────────── */

function fieldEl(l, f, i) {
  const box = document.createElement('div');
  box.className = 'f' + (i === fieldIdx ? ' sel' : '');
  box.onclick = () => { fieldIdx = i; drawFields(); };

  const k = document.createElement('div');
  k.className = 'k';
  k.textContent = f.label || f.key;
  box.appendChild(k);

  const val = config[l.key][f.key];

  if (f.type === 'color') {
    const row = document.createElement('div'); row.className = 'swatch';
    const pick = document.createElement('input'); pick.type = 'color';
    pick.value = /^#[0-9a-fA-F]{6}$/.test(val) ? val : '#000000';
    const hex = document.createElement('input'); hex.type = 'text'; hex.value = val;
    const set = (v) => { config[l.key][f.key] = v; hex.value = v; if (/^#[0-9a-fA-F]{6}$/.test(v)) pick.value = v; drawChrome(); schedule(); };
    pick.oninput = () => set(pick.value);
    hex.onchange = () => set(hex.value.trim());
    row.appendChild(pick); row.appendChild(hex); box.appendChild(row);
  } else if (rotatable(l.key, f)) {
    const opts = options(l.key, f);
    const car = document.createElement('div'); car.className = 'car';
    const a = document.createElement('button'); a.className = 'ar'; a.textContent = '◀';
    a.onclick = (e) => { e.stopPropagation(); fieldIdx = i; rotate(-1); };
    const v = document.createElement('div'); v.className = 'v'; v.textContent = val; v.title = String(val);
    const b = document.createElement('button'); b.className = 'ar'; b.textContent = '▶';
    b.onclick = (e) => { e.stopPropagation(); fieldIdx = i; rotate(+1); };
    const n = document.createElement('span'); n.className = 'n';
    const at = opts.indexOf(val);
    n.textContent = (at === -1 ? '?' : at + 1) + '/' + opts.length;
    car.append(a, v, b, n); box.appendChild(car);
  } else if (f.type === 'multi-enum' || f.type === 'block-list') {
    const wrap = document.createElement('div'); wrap.className = 'chips';
    const pool = f.type === 'block-list' ? Object.values(SCHEMA.blockVariants).flat() : f.options;
    for (const opt of pool) {
      const c = document.createElement('span');
      const on = val.includes(opt);
      c.className = 'chip' + (on ? (f.type === 'block-list' ? ' ord' : ' on') : '');
      c.textContent = f.type === 'block-list' && on ? `${val.indexOf(opt) + 1} ${opt}` : opt;
      c.onclick = (e) => {
        e.stopPropagation();
        const arr = config[l.key][f.key];
        const at = arr.indexOf(opt);
        if (at === -1) arr.push(opt); else arr.splice(at, 1);
        drawFields(); if (f.type === 'block-list') schedule();
      };
      wrap.appendChild(c);
    }
    box.appendChild(wrap);
    if (f.type === 'block-list') {
      const h = document.createElement('div'); h.className = 'hint';
      h.textContent = 'Click order is page order: ' + (val.join(' → ') || '(empty)');
      box.appendChild(h);
    }
  } else if (f.type === 'number') {
    const inp = document.createElement('input'); inp.type = 'number'; inp.min = '1'; inp.max = '16'; inp.value = val;
    inp.onchange = () => { config[l.key][f.key] = Number(inp.value); schedule(); };
    box.appendChild(inp);
  } else {
    const inp = document.createElement('input'); inp.type = 'text'; inp.value = val == null ? '' : val;
    inp.onchange = () => { config[l.key][f.key] = inp.value; schedule(); };
    box.appendChild(inp);
  }

  if (f.help) {
    const h = document.createElement('div'); h.className = 'hint'; h.textContent = f.help;
    box.appendChild(h);
  }
  return box;
}

function drawFields() {
  const host = $('fields'); host.innerHTML = '';
  const l = layer(); if (!l) return;
  if (fieldIdx >= l.fields.length) fieldIdx = 0;
  if (l.source) {
    const s = document.createElement('div'); s.className = 'src';
    s.textContent = 'source: ' + l.source; host.appendChild(s);
  }
  l.fields.forEach((f, i) => host.appendChild(fieldEl(l, f, i)));
  $('l-title').textContent = l.title;
  $('l-count').textContent = (layerIdx + 1) + '/' + layers().length;
}

function drawChrome() {
  const ls = layers();
  const dots = $('dots'); dots.innerHTML = '';
  ls.forEach((l, i) => {
    const d = document.createElement('span');
    d.className = 'dot' + (i === layerIdx ? ' on' : i < layerIdx ? ' done' : '');
    d.title = l.title;
    d.onclick = () => { layerIdx = i; fieldIdx = 0; drawFields(); drawChrome(); };
    dots.appendChild(d);
  });
  const strip = $('strip'); strip.innerHTML = '';
  for (const k of ['groundColor','surfaceColor','inkColor','accentColor','borderColor']) {
    const i = document.createElement('i');
    i.style.background = config.palette[k];
    i.title = k + ' ' + config.palette[k];
    strip.appendChild(i);
  }
  $('t-route').textContent = config.identity.category;
}

function step(dir) {
  const n = layers().length;
  layerIdx = (layerIdx + dir + n) % n;
  fieldIdx = 0;
  drawFields(); drawChrome();
}

/* ── preview ────────────────────────────────────────────────── */

let timer = null, inflight = null;
// Debounced: dragging a colour picker fires a stream of input events, and one
// request per event would queue renders the user has already moved past.
function schedule() {
  clearTimeout(timer);
  timer = setTimeout(render, 90);
}

async function render() {
  const el = $('status');
  el.textContent = 'rendering…'; el.style.color = 'var(--muted)';
  if (inflight) inflight.abort();
  const ctl = new AbortController(); inflight = ctl;
  try {
    const r = await fetch('/render', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(config), signal: ctl.signal,
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({ error: 'render failed' }));
      el.textContent = 'error'; el.style.color = 'var(--bad)';
      return msg('err', e.error || 'render failed');
    }
    const html = await r.text();
    $('prev').srcdoc = html;
    el.textContent = Math.round(html.length / 1024) + ' KB · ' + config.strategy.sitemap.length + ' blocks · ' + config.palette.basePack;
    el.style.color = 'var(--good)';
    msg(null);
  } catch (err) {
    if (err.name === 'AbortError') return;
    el.textContent = 'error'; el.style.color = 'var(--bad)';
    msg('err', String(err));
  } finally { if (inflight === ctl) inflight = null; }
}

function msg(kind, text) {
  const host = $('msg'); host.innerHTML = '';
  if (!kind) return;
  const d = document.createElement('div'); d.className = 'note ' + kind; d.textContent = text;
  host.appendChild(d);
}

/* ── actions ────────────────────────────────────────────────── */

function brief() {
  return {
    name: $('f-name').value, tagline: $('f-tag').value,
    category: $('f-cat').value, description: $('f-desc').value,
    vds: $('f-vds').value ? 1 : 0,
  };
}

async function suggestAll() {
  const r = await fetch('/suggest', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(brief()),
  });
  config = await r.json();
  layerIdx = 0; fieldIdx = 0;
  drawFields(); drawChrome(); render();
}

async function commit() {
  const name = config.identity.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  if (!confirm('Create a real project on disk at scaffolds/' + name + '?')) return;
  const el = $('status'); el.textContent = 'committing…';
  const r = await fetch('/commit', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(config),
  });
  const out = await r.json();
  if (!r.ok) { el.textContent = 'failed'; el.style.color = 'var(--bad)'; return msg('err', out.error); }
  let t = 'Created ' + out.outDir + '\n  blocks: ' + out.blocks.join(', ');
  if (out.governed) t += '\n  .vds/: ' + out.vds.records + ' records, ' + out.vds.advanced + ' advanced to built\n  surface: ' + out.vds.surface.join(', ');
  else if (out.vds) t += '\n  vds: ' + out.vds;
  if (out.note) t += '\n  note: ' + out.note;
  el.textContent = 'created'; el.style.color = 'var(--good)';
  msg('ok', t);
}

/* ── keyboard: the reason this feels like a character sheet ─── */
document.addEventListener('keydown', (e) => {
  const t = e.target.tagName;
  if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
  const l = layer(); if (!l) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); rotate(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); rotate(+1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); fieldIdx = (fieldIdx - 1 + l.fields.length) % l.fields.length; drawFields(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); fieldIdx = (fieldIdx + 1) % l.fields.length; drawFields(); }
  else if (e.key === 'Tab') { e.preventDefault(); step(e.shiftKey ? -1 : +1); }
  else if (e.key === 'r' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); reroll(); }
});

async function boot() {
  SCHEMA = await (await fetch('/schema')).json();
  $('t-vds').textContent = SCHEMA.vdsAvailable ? 'vds available' : 'vds not found';
  if (SCHEMA.vdsAvailable) $('t-vds').classList.add('on');

  $('b-suggest').onclick = suggestAll;
  $('b-reroll').onclick = reroll;
  $('b-commit').onclick = commit;
  $('b-prev').onclick = () => step(-1);
  $('b-next').onclick = () => step(+1);
  $('f-cat').onchange = () => { config.identity.category = $('f-cat').value; layerIdx = 0; fieldIdx = 0; drawFields(); drawChrome(); schedule(); };
  $('f-vds').onchange = () => { config.governance.vds = Boolean($('f-vds').value); };
  for (const [id, key] of [['f-name','name'],['f-tag','tagline'],['f-desc','description']]) {
    $(id).oninput = () => { config.identity[key] = $(id).value; schedule(); };
  }
  $('b-wide').onclick = () => { $('prev').classList.remove('narrow'); $('b-wide').classList.add('on'); $('b-narrow').classList.remove('on'); };
  $('b-narrow').onclick = () => { $('prev').classList.add('narrow'); $('b-narrow').classList.add('on'); $('b-wide').classList.remove('on'); };

  await suggestAll();
}
boot();
</script>
</body>
</html>
