<!doctype html>
<html lang="en">
<head>

<title>404 demo</title>
<link rel="stylesheet" href="notfound-demo.css">
</head>
<body>
<section class="notfound notfound--search">
  <p class="notfound__code">404</p>
  <h1>This page doesn&#39;t exist.</h1>
  <p>The block you&#39;re looking for may have been renamed or removed.</p>

    <input class="notfound__searchInput" type="search" name="q" placeholder="Search the docs" aria-label="Search">
  </form>
  <a class="notfound__link" href="#">Back to home</a>
</section>
</body>
</html>
