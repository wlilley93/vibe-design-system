<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manifest B - hero-2 + footer-b, geist style</title>
<link rel="stylesheet" href="manifest-b.css">
</head>
<body>
<section class="hero hero--split">
  <div class="hero__text">
    <h1 class="hero__h1">The same block, wearing a different system.</h1>
    <p class="hero__sub">This page is hero-2 + footer-b under Geist&#39;s real extracted tokens - not a redraw, a re-skin.</p>
    <a class="hero__cta" href="#">Read the tokens</a>
  </div>
  <div class="hero__media" role="img" aria-label="Placeholder media panel"></div>
</section>
<footer class="footer footer--columns">
  <div class="footer__grid">
    <div class="footer__brand">
      <span class="footer__mark">Site Factory</span>
      <p class="footer__tagline">Blocks in, tokens in, a site out.</p>
    </div>
    <div class="footer__col">
      <h3 class="footer__colTitle">Product</h3>
      <nav class="footer__colLinks" aria-label="Product">
        <a class="footer__link" href="#">Blocks</a>
        <a class="footer__link" href="#">Styles</a>
      </nav>
    </div>
    <div class="footer__col">
      <h3 class="footer__colTitle">Company</h3>
      <nav class="footer__colLinks" aria-label="Company">
        <a class="footer__link" href="#">About</a>
        <a class="footer__link" href="#">Careers</a>
      </nav>
    </div>
    <div class="footer__col">
      <h3 class="footer__colTitle">Resources</h3>
      <nav class="footer__colLinks" aria-label="Resources">
        <a class="footer__link" href="#">Docs</a>
        <a class="footer__link" href="#">Changelog</a>
      </nav>
    </div>
  </div>
  <div class="footer__bottom">
    <span class="footer__copyright">© 2026 Site Factory</span>
  </div>
</footer>
</body>
</html>
