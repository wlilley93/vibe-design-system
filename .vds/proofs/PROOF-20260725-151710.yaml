- '[reach] limb (c) of VDS S-5(6), whether each register entry''s Figma node id resolves in the pinned file, is NOT checked by this run. Resolving a node id requires a call to the Figma API and VDS S-7(2)(1) forbids a network call inside a proof, so every record was counted and skipped rather than passed. A register entry naming a node that was deleted from the decided-target file passes this run.'
