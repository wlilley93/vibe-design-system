notes:
- the screens ledger's staleness test REGENERATES the ledger from its sources and compares the content, rather than comparing the source digest the ledger records. A source-digest comparison answers only whether the screens moved, so it certifies a hand-edited ledger clean, and a proof reading that ledger can then be flipped from failing to passing without touching a screen (VDS S-2(5)(4)).
- 'what this run does NOT reach: this build holds one REGENERATING staleness test, the screens ledger''s. The figma ledger (R3), the frame ledger (R4) and the CI run ledger (R6) have self-consistency tests instead, because their source is behind a network call and there is no generator here to re-run against it. For every other file in the ledgers directory it establishes only that no staleness test exists, never that the file is current. It reaches nothing outside the configured ledgers directory. And where the declared screens ledger is absent the run is a precondition failure at exit 2, so the other files in that directory go unexamined rather than passing.'
- '[ci-ledger] the CI run ledger''s source is `gh run list`, a network fact, so no gate can regenerate it offline - the same settlement as the figma (R3) and frame (R4) ledgers. What IS checked: every internal cross-total (histogram vs runs_concluded, successes vs the success bucket, the never_succeeded flag vs the numbers beside it, window ordering), because those are what a hand-edit breaks - an editor flipping `successes` to make D4 read better does not also rebuild the histogram derive() builds with it. What is NOT checked: currency. A stale-but-consistent ledger passes; `generated_at` is the reader''s signal, and D4''s own text says a ledger is evidence of the runs it recorded, not of runs since.'
