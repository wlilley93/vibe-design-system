- '[reach] this proof reads the register''s own account of what is drawn. `states.drawn` is the author''s claim, and confirming it against the decided-target Figma file is a network read that VDS S-7(2)(1) forbids inside a proof. A pass establishes that the contract is complete, never that a frame exists in the file.'
- '[taste] whether a drawn state looks right is reserved to the Principal (VDS S-1(6)). This proof checks that a required state is drawn, never that it is good.'
- '[parity] a required state that is drawn and not built is recorded here as an informational finding and never fails this gate; the `parity` proof is the gate for that gap (VDS S-7(5)). Informational findings are captured on the proof record and are not printed, so the record is where they are read.'
- '[register] the register holds no record, so no row can be enforced and this run is vacuous. A states proof over an empty register establishes nothing about any component (VDS S-7(2)(4)).'
