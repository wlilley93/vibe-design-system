id: BREACH-0007
at: 2026-07-30T21:50:00Z
by: jellytot
what_happened: 'The Figma variable collection that the drawings bind to had diverged from the style packs that define it, in two independent ways at once, and no gate in the repository could see either. site-factory already pairs code to Figma in one dimension: FIGMA_NODES maps each block type to a component set, and two tests run it in both directions, because a block shipping without a drawing divides the bank silently. The TOKENS were never paired. MEASURED against the four packs in `tokens/`: (1) FOUR variables the build emits had no variable in the collection at all - `color/dangerInk`, `color/warningInk`, `color/successInk`, `color/infoInk` - so a drawing that wanted an accessible ink per tone could not ask for one; (2) NINE mode values disagreed with the pack that defines them. The Base palette measurement (`site-factory/vendor/uber-base-keys.json`) landed in `tokens/*.json` and never reached Figma, so the Geist mode held `color/danger: #fc0035` while the shipped CSS said `#de1135`, `color/success: #28a948` against `#0e8345`, `color/warning: #ffb200` against `#f6bc2f`, `color/info: #0070f3` against `#276ef1`, and the Placeholder mode was wrong on five including `color/accent`. Every component redrawn on the `Base (redrawn)` page during the tier-1 work was therefore drawn in a different red, green, amber and blue from the ones the factory builds, and both sides looked deliberate. The second fault is how the first was found, and it is the worse of the two as a matter of practice: the System banner builder resolved its four tones through a guard reading `V[bg] && V[ink]`, so the three tones whose ink variable did not exist were FILTERED OUT. The call returned three component set ids and reported success. It had drawn one tone of four. Nothing in the return value distinguished that from the intended result, and it was caught only because a screenshot was taken of a set that should have been four variants tall and was 160px.'
law_breached:
- 'VDS S-8(5), which forbids overclaiming the enforcement surface. The pairing of code to Figma was asserted as a property of the system while covering component sets only. A reader of `tests/skills.test.js` would reasonably have concluded the two sides could not drift.'
- 'VDS S-2(2), no_stored_values, in spirit rather than letter. The values were not stored in a VDS record, but nine colour decisions existed in two places with no derivation between them, which is the condition that rule exists to prevent.'
- 'The duty of reasonable skill and care (S-4..S-8): a builder that treats an absent dependency as a variant to drop, and then reports success, produces a result no reader can check.'
discovered_by: 'Working the tier-1 Base redraw. A screenshot of the `Base/System banner` component set rendered 748x160 - one variant - where four were expected. Reading the collection back showed 13 variables against the packs 17, and the drift fell out of the same read.'
containment: 'REMEDIED in this commit, guard first. (1) `site-factory/figma-variables.json` records a MEASURED read of the collection: mode names, and every variable value keyed by mode name rather than modeId, which is file-local. (2) `FIGMA_VARIABLE_MODES` in vds-bridge.js binds each Figma mode to the pack that DEFINES it, code as source of truth, same direction as FIGMA_NODES; the two packs with no mode are declared unbound with reasons, because a manifest listing only what it checks cannot be audited for what it skips. (3) Three tests: every mode names a real pack and every pack is bound or declared unbound; every emitted `--color-*`/`--radius-*` has a variable AND every variable names an emitted property; every mode value equals its pack. Run before the fix they were RED on exactly the 4 absent and 9 drifted, naming each. The four variables were then created and the nine values corrected against a payload generated from the packs rather than typed, and the script read the collection BACK and compared, because a write that was accepted and a value that is now correct are different claims: 4 created, 9 corrected, 0 wrong. (4) The builder now calls `need(token)` which THROWS on an absent variable, and `setOf` asserts the variant count it was told to expect. Rebuilt: 4, 4 and 2 variants, confirmed by screenshot with Warning correctly taking dark ink.'
remedy:
- 'Pair the token collection to the packs in both directions, with values compared per mode.'
- 'A builder refuses an absent token rather than dropping the variant that needed it.'
- 'Assert the count of things built against the count intended, inside the script that builds them.'
- 'OPEN: the value test compares the packs against a measurement file, so it detects drift only when someone re-measures. It cannot read Figma from CI. That is honest and it is weaker than the component-set pairing, which at least checks a node id shape offline. The measurement carries `measured_at` and nothing yet fails when that date goes stale.'
prevention: 'Two rules, and the second is the general one. FIRST: when a pairing between two systems is built, enumerate every DIMENSION in which they can disagree, not just the one that prompted the work. Components and tokens are both halves of the same file, the same drift, and the same test file, and only one was covered for months. SECOND, and this generalises past Figma: A GUARD THAT SKIPS WHAT IT CANNOT RESOLVE IS AN OUTAGE THAT REPORTS SUCCESS. `V[bg] && V[ink]` reads as defensive and is the opposite - it converts a missing dependency into a smaller result with no error, which is indistinguishable from the intended result at the call site. The same shape has now cost this program three times: a localhost fallback that 502d, a bearer that fell back when it did not resolve, and this. The correct form of a guard over a dependency is to throw with the name of what was missing.'
