id: BREACH-0006
at: 2026-07-30T18:45:00Z
by: jellytot
what_happened: 'Two more criteria settled themselves by reading a field rather than the thing the field describes, found by working BREACH-0004 remedy item 3 (re-examine the criteria settled "by a scan over" a record VDS writes). D3, whose title is "no vacuous passes", filtered on `status == Vacuous` alone - so a record reading `status: passed` over `rows_enforced: 0` IS a vacuous pass and D3 agreed with the label. MEASURED: relabelling the newest contrast record while leaving its rows at zero made D3 stop flagging that kind entirely. D2 was worse in kind because the limbs it got wrong are the two the statute is most specific about. Its `named_test` limb was `entry.is_some()` - a lock ENTRY existing, not the test it names existing. Its `invoked` limb was `!invoked_by.is_empty()`, so a `surface: manual, blocking: false` entry satisfied VDS S-7(2)(3), the limb that exists specifically to require invocation by something OTHER than the author choosing to run it. MEASURED: rewriting the contrast entry to manual and non-blocking left D2 silent about invocation while D4, on the same entry, correctly reported "no blocking ci_workflow invocation". D1 and D9 were checked and are sound: D1 reads rows_enforced, and D9 already PARSES each record and checks its defects, with a comment recording that lesson ("a count taken without opening anything is a count of files").'
law_breached:
- 'VDS S-7(2)(2): a named test that seeds a violation. D2 accepted a lock entry naming a test without establishing the test exists.'
- 'VDS S-7(2)(3): invocation by something other than the author choosing to run it. D2 accepted `surface: manual` as satisfying it, which is the precise opposite of the limb.'
- 'VDS S-7(2)(4): a vacuous run is never evidence. D3 could not distinguish a vacuous run from a pass when the record''s own label disagreed with its own count.'
- 'VDS S-8(5), which forbids overclaiming the enforcement surface. Both criteria reported on strength they had not established.'
discovered_by: 'BREACH-0004 remedy item 3, worked deliberately rather than found by accident. The item said: D1, D2, D3 and D9 all read .vds/ artefacts, and each needs asking whether the artefact is the EVIDENCE or merely the ASSERTION. Two of the four were the assertion.'
containment: 'REMEDIED in the same commit under DECISION-0005. D3 derives vacuity from rows_enforced and treats `status` as corroboration, reporting a record whose two disagree as its own problem rather than silently resolving it in favour of either field - a disagreement means something wrote a record it had not earned and nothing else looks for that. D2 now holds both limbs to the standard the rest of the system already holds: the test name must resolve in its file, and the invocation must be a blocking ci_workflow whose job and step resolve in the workflow, reusing resolve_ci_reference. Both original seeds were re-run against the fix and are now caught with reasons that name the defect. Failing-direction test: a_pass_over_zero_rows_is_still_a_vacuous_pass, which asserts the two HONEST combinations as well as the two dishonest ones, because a classifier that flagged everything would pass every negative arm and prove nothing.'
remedy:
- 'D3: derive vacuity from rows_enforced; report label/count disagreement in both directions.'
- 'D2: resolve the named test and resolve the blocking ci_workflow reference.'
- 'A THIRD defect found while fixing these and not yet closed: `crates/vds-cli/src/doctor.rs` was on NEITHER enforcement list - not pinned in enforcement.lock, not covered by permit_required - while every proof it grades was on both. D2, D3 and D4 were each weakened and then strengthened on 2026-07-30 and no drift finding fired. It is declared in permit_required now, which is a declaration and not yet a gate (the permit lifecycle at S-12(1) is specified and not implemented, and config.toml says so). Pinning it in enforcement.lock does not fit the lock''s shape, because a lock entry `proves` a ProofKind and the doctor proves none - it grades. That mismatch is the open question.'
prevention: 'The rule from BREACH-0004 held and generalised: a criterion settled by reading a field VDS wrote establishes what the field SAYS. It now has a sharper form. THE REPORTING SURFACE NEEDS THE SAME PROTECTION AS THE THING IT REPORTS ON. Changing a proof trips the lock; changing the code that grades the proofs tripped nothing, which is the one place a weakening is invisible. Ask of every criterion not only "what would have to be opened to establish this" but also "what watches the code that answers it".'
