id: BREACH-0012
at: 2026-08-01T14:05:00Z
by: jellytot
what_happened: 'Three enforcement gates were edited and shipped without their pins being re-recorded in the same act. `crates/vds-cli/src/lock.rs`, `crates/vds-proof/src/geometry.rs` and `crates/vds-proof/src/ledger_staleness.rs` were all rewritten while implementing the carried orders of [2026] VJS-CA-VDS 1, and the enforcement lock kept the pre-change digests. The drift was not discovered by anyone looking at the gates: it was discovered because `git push` ran `make check`, which ran `vds lock verify`, which refused the push with three DRIFT findings. So the instrument worked exactly as designed, and the author did not. Between the edits landing and the push being attempted, the repository was in a state where three of its own gates were unpinned and `vds lock verify` would have said so to anyone who ran it, and nobody did.'
law_breached:
- 'VDS S-8(4): re-pin only after a recorded gate change, and self-file the rationale. The gate changes were recorded (they are carried orders of a judgment) but the re-pin did not accompany them, so for the intervening period the lock asserted digests that no longer described the gates it names.'
- 'VDS S-12(3): a re-pin without a self-filed breach report is a rationale nobody has to answer for. The CLI printed that sentence at me on completion, which is the tool doing the remembering the author should have done.'
discovered_by: 'CAUGHT, by the pre-push hook, before anything reached the remote. This is the good outcome and it is worth stating plainly rather than filing this as a near-miss: the push FAILED, the three findings were named in full with both digests each, and the remote never received an unpinned gate. The breach is real (the pins were stale for a window) but the containment was structural rather than lucky. A `git push` of the feat/proof-kinds-visual-gap branch at 13:33 exiting non-zero after `make check` -> `gates` -> ENFORCEMENT DRIFT, 3 findings.'
containment: 'CLOSED. The judge sitting on [2026] VJS-FI-VDS 1 hit these same three drifts while working in this tree and DECLINED to clear them. Their reasoning, recorded in their report: `vds lock repin` re-pins every drifting gate at once, so running it under the FI-1 citation would have recorded three unrelated changes under a judgment that never considered them. They re-pinned only their own entry, by hand, and left these three named as live S-8(4) items for someone with the right authority. That is the correct instinct and it is the one this breach report exists to reinforce: a bulk re-pin is a bulk ASSERTION, and its blast radius is every gate that happens to be dirty at the moment it runs. It was safe to use here only because the drifting set turned out to be exactly the set one judgment ordered, and that was checked before running it, not assumed.  `vds lock repin --rationale` re-pinned all three, each recording what it superseded. `vds lock verify` now reports no drift. The rationale names the specific carried orders each file implements (3 and 38 for lock.rs, 6 to 9 for geometry.rs, the order 39 election for ledger_staleness.rs) rather than citing the judgment as a whole, so a later reader can check each pin against the order that authorised it instead of taking the citation on trust.'
remedy:
- 'Re-pin in the SAME commit as the gate edit, not at push time. The rule is already written in three places in this repository and was still not followed, which suggests the gap is not knowledge but sequencing: the edit and the pin are two acts and only the first one feels like work.'
- 'The blast radius of `repin` deserves a narrowing. It takes no path argument, so it can only ever re-pin everything dirty. A `--only <path>` form would let an author re-pin exactly what their rationale covers, and would have let the FI-1 judge clear their own entry through the tool instead of by hand. Filed as a change proposal, not done here: it is a CLI change and this is a breach report.'
prevention: 'A BULK RE-PIN IS A BULK ASSERTION, AND ITS SCOPE IS WHATEVER HAPPENS TO BE DIRTY. The danger is not that re-pinning is wrong; it is that the rationale a person writes describes the change they have in mind while the command applies it to every change in the tree. In a repository where several agents write concurrently, the set of dirty gates at any moment is not knowable from the author''s own work. So: before running `repin`, run `verify` and read the list, and satisfy yourself that every entry on it is covered by the rationale you are about to write. If any entry is not, stop and re-pin by hand. That check took one command here and it is the difference between a citation that holds and one that launders.'
