id: BREACH-0011
at: 2026-07-31T09:10:00Z
by: jellytot
what_happened: 'No gate in this repository has ever been run by anything except a person deciding to run it, and D4 - the criterion whose text is "every gate is invoked by CI, not only by a hook" - reports MET. MEASURED, three ways. (1) `gh run list --workflow=vds-enforce.yml --limit 60`: fifty-three runs in the window, **fifty-three failures and zero successes**, the oldest at 2026-07-25T14:06:34Z, which is the week this repository began. There has never been a successful run. (2) The reason is not a failing test. Every run ends in three to eleven seconds and the annotation is verbatim: `The job was not started because recent account payments have failed or your spending limit needs to be increased. Please check the ''Billing & plans'' section in your settings`. The `enforce` job has never STARTED. (3) `.git/hooks/` holds nothing but the samples git ships, so there is no local surface either - not a pre-commit hook, not a pre-push hook. The enforcement lock carries eighteen `ci_workflow` invocations, every one blocking, every one naming a job that has never run, plus thirteen `package_script` invocations which are commands a person may type. So the true position is: seventeen pinned gates, zero automated executions, for the entire life of the project. The two enforcement drifts closed in this same commit are the symptom, not the disease - `crates/vds-cli/src/doctor.rs` was edited in 78f196a and `crates/vds-store/src/lock.rs` in 3fd5a7d, both legitimate strengthenings that rode along in commits whose subject lines named something else, and both shipped because `vds lock verify` - which catches this class immediately and did catch it the moment it was run by hand - is wired to a job that does not start.'
law_breached:
- 'VDS S-7(2)(3): a run must be invoked by something other than the author choosing to run it. Every run in this repository''s history was the author choosing to run it.'
- 'VDS S-7(3): a hook is not CI. There is not even a hook, so the interim state the statute contemplates is not the state this repository is in - it is one below it.'
- 'The duty of reasonable skill and care (S-4..S-8): D4''s own settled-by line reads "the lock, with every blocking ci_workflow reference resolved against the workflow file it names". Resolving a reference against a FILE and reporting that the gate is invoked by CI is a claim wider than its check, in the one criterion whose entire subject is whether the gates actually run.'
discovered_by: 'Asking why two gate edits reached master without a re-pin, when `vds lock verify` detects exactly that and is wired into CI as a blocking step. The only answers were that the check is broken or that the step does not run; `gh run list` settled it in one command. Nothing in the repository was looking, because every instrument that could have looked reads the workflow FILE.'
containment: 'PARTIAL. The two drifts are closed: `vds lock repin --rationale` re-pinned both, `vds lock verify` now reports no drift across 17 entries, and the lock was checked for the BREACH-0009 corruption signature (0 occurrences of test-runner output, 17 entries intact). The root cause is NOT closed and cannot be closed inside this repository: the GitHub Actions job will not start until the account billing is settled, which is the Principal''s to do and nobody else''s. What is closed is the pretence - D4 must stop reporting MET, and every "invoked by CI" line in this repository must be read as "declared in a workflow file that has never executed" until a run concludes successfully.'
remedy:
- 'D4 needs a third limb, and the first two are already there. It went from reading the lock''s own declaration (the BREACH-0004 defect) to resolving the job and step in the workflow file (the BREACH-0004 fix). It never reached EXECUTION. A run concluding is a network fact, so under VDS S-7(2)(1) it cannot live inside a proof: it belongs in a ledger generated out of band from a saved `gh run list --json` response, reproducible with `--from`, exactly as `vds figma pull` is. D4 then reads the ledger and reports UNMET while the newest conclusion is not a success.'
- 'Give the gates a surface that actually runs on this machine. A pre-push hook running `make gates` plus the site-factory gate, recorded in the lock as `githook_pre_push` and NOT as a substitute for CI - the InvokedBy enum already carries that variant and its own doc comment already says a hook is not CI, so the interim state is representable and should be recorded rather than hidden behind a dead ci_workflow entry.'
- 'Never plan a step in this programme that depends on GitHub Actions running. There is no CI budget on this account and there has not been one for the life of this repository; a plan that routes verification through Actions is a plan that verifies nothing.'
- 'OPEN, and it is the Principal''s: settle the Actions billing, or decide that this repository''s blocking surface is local and amend D4''s text so the criterion describes the arrangement actually in force rather than one nobody has ever had.'
prevention: 'A CHECK IS INVOKED WHEN A RUN CONCLUDED, NOT WHEN A FILE SAYS IT WOULD. This is the third pass at the same criterion and each pass moved one step closer to the destination without arriving: first D4 read the lock''s declaration about itself, then it read the workflow file the declaration named, and the thing it never read was the only artefact that could settle the question - the run. The general rule this programme already holds in three other forms (measure delivery at the destination; running is not serving; verify the artefact, not the chunk) applies to gates as well, and the gate case is worse than the others because the instrument that would have caught it was itself the instrument not running. Concretely: whenever a criterion asserts that something HAPPENS, the settling artefact must be a record of it having happened, and a declaration that it should happen is evidence of intent and nothing else. Fifty-three consecutive failures went unremarked for six days in a repository whose stated purpose is that a defect becomes a failed proof at authoring time instead of an audit finding months later. This was an audit finding.'
