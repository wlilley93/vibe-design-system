id: BREACH-0004
at: 2026-07-30T17:20:00Z
by: jellytot
what_happened: 'D4 "every gate is invoked by CI, not only by a hook" reports MET by scanning .vds/enforcement.lock and never opening the workflow the lock names. Sixteen entries carry an `invocation.reference` of the form ".github/workflows/vds-enforce.yml job:enforce step:Proofs"; nothing resolves that string to a step that exists. MEASURED by negative control on 2026-07-30: renaming the workflow step so that ZERO steps are named "Proofs" while 12 lock entries still cite step:Proofs left D4 reporting "MET - 16 pinned gates, every one invoked by a blocking ci_workflow". The criterion that certifies the gates reach CI is itself unable to fail. Its own settled-by line states the defect plainly ("a scan over .vds/enforcement.lock") and was read as a description of method rather than as a limit on what the scan establishes. Second, related defect found the same day: the site-factory JS gate (78 tests, 7 files, its own floor) was in `make check` and in NO CI job, so the one tree added to the repo BECAUSE it "shipped ungated" was enforced only by whoever remembered to run make. The Makefile asserted the opposite at line 3, that `make check` is "the same set the CI trust root runs, in the same order".'
law_breached:
- 'VDS S-7(2)(3): a check is a proof only if it is invoked by something other than the author choosing to run it. A Makefile-only gate does not satisfy it, and VDS S-7(3) says so directly ("a hook is not CI").'
- 'VDS S-8(5), which forbids overclaiming the enforcement surface. D4 claims 16 gates reach CI on evidence that establishes only that 16 lock entries SAY they do.'
- 'The founding ratio of BREACH-0001, applied to VDS itself: an artefact that STORES a claim is an authority, and only a DERIVING check is permitted. `invocation.reference` is stored prose about CI, exactly as the token pin in BREACH-0001 was stored prose about a contrast ratio.'
discovered_by: 'A five-lens read-only audit of this repository, run 2026-07-30 as 43 agents with each finding independently refuted before it was kept. 38 raised, 26 survived. Nothing in the repo''s own gates surfaced either defect, which is the point: `vds doctor` exits 1 on this tree today and has done so for days, and the four UNMET criteria are documented as correct-by-design, so a fifth criterion silently reporting MET on unvalidated input was invisible against that background.'
decision_log_id: DECISION-0004
containment: 'REMEDIED 2026-07-30T18:10:00Z under DECISION-0004. CLOSED. `resolve_ci_reference` in crates/vds-cli/src/doctor.rs parses each blocking ci_workflow reference into (workflow, job, step) and resolves it against the file: a missing workflow, a missing job, a missing step, or a reference naming no job at all each produce a distinct reason, because "unresolvable" collapses four different fixes into one word. The failing-direction test VDS S-7(2)(2) requires is a_ci_reference_naming_a_step_that_does_not_exist_is_refused, and it asserts BOTH directions - a resolver that refused everything would make every negative arm pass, so the arm proving a real reference RESOLVES is what stops the test being vacuous. Verified by re-running the original measurement: renaming the step so zero steps are named Proofs now takes D4 to UNMET, naming each of the sixteen sites and listing the steps that do exist. Re-pinned under DECISION-0004. WHAT IS STILL NOT ESTABLISHED, stated because S-8(5) forbids overclaiming: a step of the cited name existing does not mean the step RUNS the gate. A step named Proofs whose body is `echo hi` resolves. That is a separate question and is recorded on the function itself rather than left to be discovered. ||| The site-factory half is closed: the JS gate is now a step in .github/workflows/vds-enforce.yml, and `test-factory` was the only Makefile target without a .PHONY declaration, so a file of that name at the repo root would have made make skip the gate silently. Both fixed in this commit. The D4 half was NOT contained at filing, because the resolver has to live in crates/vds-cli/src/doctor.rs and another session was editing that tree at the time; editing another writer''s files to fix a governance defect would have been a second breach. It landed later the same day once that session had committed and gone quiet - see below.'
remedy:
- 'Resolve `invocation.reference` against the workflow file: parse .github/workflows/*.yml, and report UNMET when a cited job or step does not exist. Report UNMET separately when the cited step exists but is not blocking.'
- 'Add a failing-direction test that seeds a lock reference to a step name that is absent and asserts D4 goes UNMET. Without it the fix is unproven, and by VDS S-7(2)(2) an unproven check is not a proof of anything.'
- 'Re-examine the sibling criteria settled "by a scan over" a record VDS itself writes. D1, D2, D3 and D9 all read .vds/ artefacts; each needs asking whether the artefact is the evidence or merely the assertion.'
prevention: 'The failure class is a check that reads a SELF-DECLARATION instead of the thing declared, and it is the same class as BREACH-0001 one level up: there, a pin asserted a contrast ratio nobody derived; here, a lock asserts a CI invocation nobody resolves. The general rule earned from this: when a criterion says it is settled by a scan over a file that this system writes, the scan can only establish what the file SAYS. Ask what would have to be opened to establish the claim, and open it. A negative control is the only way to tell the two apart - D4 looks identical whether it is working or not until a step is renamed and it goes on saying MET.'
