id: BREACH-0010
at: 2026-07-31T09:03:26Z
by: jellytot
what_happened: 'The Figma master file (`4pPUFvaPdqYzPquBusSfWl`, 18 pages, 46 component sets) cannot be redrawn by anything in this repository, while two committed artefacts describe it as generated. `site-factory/figma-nodes.json` opens its own `_what` field with the framing that the file is a measured read of what was drawn, and `site-factory/docs/DESIGN-TWIN.md` stated, as the evidence for its central claim, that "Every one of the 46 component sets in the master file was DRAWN BY SCRIPT" and therefore "the station is still there, but the traffic is one-way and automated, so nobody carries anything across by hand". MEASURED: a grep for `createComponentSet`, `combineAsVariants` and `createComponent(` across the entire repository - every extension, excluding only `target/` - returns ZERO hits. The only committed Figma generator is `site-factory/figma-push.js`, whose own module comment says it builds a project RECORD page of frames and text; it creates no component and no component set. Every one of the 46 sets was drawn by a script written inside an agent turn, run once, and discarded. So the first half of the sentence was true and the second half was the opposite of true: what is automated is the CHECKING of the two sides against each other, and the crossing itself was hand-carried every time.'
law_breached:
- 'The duty of reasonable skill and care (S-4..S-8): a claim in a committed document must be the same size as what settles it. "The traffic is one-way and automated" is a claim about a program, offered with no program named, in the file whose entire subject is whether that crossing is automated.'
- 'VDS S-5(5): a hand-maintained artefact decays. Forty-six component sets with no generator are a hand-maintained artefact of the largest kind in this programme, and nothing recorded them as such.'
discovered_by: 'Planning the answer to "a full Figma library, and a way to turn that into contracts that can supply future Figma or code". Establishing what already existed for the outbound direction meant finding the generator; grepping for the three Figma Plugin API calls that must appear in any code that creates a component returned nothing, which is not a shortfall in the generator but the absence of one.'
containment: 'REMEDY LANDED AND PROVEN, 2026-07-31, and the original containment stands below. `site-factory/figma-draw.js` is committed and builds a `use_figma` script from the register plus the measured axes. RUN AGAINST THE REAL FILE, TWICE. First run: 3 sets drawn on a new `Library (generated)` page (node ids 90:9, 90:16, 90:29), 0 skipped, and ONE REFUSAL - `no variable named color/rule` - which is the mechanism working rather than failing: the stylesheet calls that token `rule` and the Figma collection calls it `border`, and the script said so by name instead of drawing an edgeless frame and reporting success. Second run, after correcting the name: `drawn: 0, amended: 3, setsOnPage: 3, refusals: []`, and the ids recorded BEFORE the run were compared with the ids after - `idsSurvived: true`, all three unchanged. So a redraw amends in place and `figma-nodes.json` stays valid, which is the whole difference between a remedy and a second way to lose the file. WHAT IS NOT YET DONE: only 3 of 43 blocks have been run through it, because the Figma skill caps a single call at about ten logical operations and 43 blocks is far past that; and the generator draws a NAMED, TYPED PLACEHOLDER per variant rather than an approximation of the block markup, deliberately, because [2026] VJS-CC-OPBOX 3 D1 makes the file the system of record for what is decided and a generator inventing visual decisions would be the fourth authority that order forbids. ORIGINAL CONTAINMENT: This record and the correction written into `site-factory/docs/DESIGN-TWIN.md` are the containment: both overstating sentences are now marked, and the file instructs a reader to read every "outbound is automated" line in it as "outbound is CHECKED". The three pairing manifests are unaffected and remain true - `figma-variables.json` pairs every emitted custom property to a Figma variable by value and found four missing inks and nine drifted values, `figma-nodes.json` pairs every block type to a set that exists in both directions, `figma-prompts.json` fingerprints every prompt against its source. What none of them can do is PRODUCE either side, and none of them ever claimed to.'
remedy:
- 'Commit a drawing generator whose input is the register plus the token packs and whose output is deterministic: two runs must be byte-identical, golden-filed, so a change to the drawing is a diff rather than a re-draw.'
- 'Stamp an identity marker on every set it draws (`setSharedPluginData` with the component id) so a second run AMENDS in place and node ids survive. Without that, "regenerate" means destroy and recreate, every node id in `figma-nodes.json` becomes stale in one command, and every placed instance loses its overrides.'
- 'DONE: a committed generator, deterministic (two runs byte-identical, asserted), whose emitted script is also PARSED by the test - the first version emitted a raw newline inside a string literal and every text-based assertion passed on the broken script.'
- 'DONE: the identity stamp, proven by measurement rather than by claim - see containment.'
- 'OPEN: nothing detects this class. A component set can exist in the file, pair correctly against a block type, pass every one of the three manifests, and be unreproducible - because all three instruments compare two artefacts and none asks whether either was produced by a program. The check wanted is not another pairing but a provenance question: for each set, name the committed code that draws it, and fail when the answer is nothing.'
prevention: 'A PAIRING IS NOT A PROJECTION, AND THE WORD "GENERATED" MUST NAME THE GENERATOR. Three instruments that all check agreement can make a hand-built artefact look derived, because agreement is what a derived artefact has - and it is also what a carefully hand-maintained one has, right up until the day somebody stops maintaining it. The distinguishing question is never "do the two sides agree" but "what would happen if I deleted one side", and that question was never asked here because the manifests answered a nearby question so well. From now on: any document in this programme that calls an artefact generated, projected, derived or drawn-by-script must name the committed entry point on the same line, and if it cannot, the correct word is CHECKED.'
