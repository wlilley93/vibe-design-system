id: BREACH-0008
at: 2026-07-30T23:20:00Z
by: jellytot
what_happened: 'Eleven element classes were emitted by site-factory blocks and had no rule anywhere in the stylesheet, and nothing could see it. Found by rendering all 78 block variants under a style pack and pairing every class in the markup against the rules in STRUCTURE_CSS - the first time the two halves of the component had ever been compared. They are not cosmetic omissions. `.md__rail` is the THIRD PANE of the master-detail assembly: `.md__master` carries border-right and `.md__detail` carries min-width, so the layout has a rule on two of its three seams and the inspector ran flush into the detail with nothing between them. `.md` is that assembly own root and had no rule at all, so the facet strip sat above the panes by accident of document flow rather than because anything said so. The other nine are containers whose CHILDREN were styled while they were not: `.hero__text`, `.cta__text` and `.contact__info` are the left halves of two-column blocks whose right halves (`.hero__media`, `.cta__form`, `.contact__form`) all had rules; `.footer__brand` and `.footer__col` hold `.footer__colTitle` and `.footer__colLinks`, both styled; `.faq__list`, `.facet__search`, `.oview__id` and `.team__rowText` likewise. In every case the cascade happened to produce something survivable, which is why it lasted. Separately, two of my OWN new blocks had comments promising behaviour the stylesheet did not implement: menu.js said the destructive group was separated from the others and no rule separated it, and draggablelist.js said the divider was inset to the text per Base measurement while the CSS used a full-bleed border-top on the row.'
law_breached:
- 'VDS S-8(5), overclaiming the enforcement surface. site-factory asserts that a block is code AND Figma and tests the pairing in both directions; it never tested that a block was code and STYLESHEET, which is the pairing every rendered page depends on.'
- 'The duty of reasonable skill and care (S-4..S-8): a comment stating a component behaviour that the code does not implement is worse than no comment, because a reader who trusts it stops checking.'
discovered_by: 'Not by looking at a page. By writing a script during the control-layer build to pair every class emitted by all 78 variants against the rules in the stylesheet, on the suspicion that new blocks might have emitted classes I had not styled. They had - one, a modifier - and the same walk surfaced eleven pre-existing element classes and 23 unstyled modifiers.'
containment: 'REMEDIED in this commit. All eleven now have rules that do real work, and the two false comments are true: the destructive menu group takes a margin above its border, and the draggable divider is a positioned rule starting at the text (16, or 80 past the artwork) because a border-top cannot start where the text does. Six modifier classes in the new blocks that did no work were REMOVED rather than given empty rules. The check is now a test over all 78 variants, drawing the line at element vs modifier: a `--modifier` on a block root is a documented DOM hook a consuming project targets and is legitimately unstyled in a structural sheet, while an `__element` is a part of the component and an unstyled part is a part whose layout is inherited by luck. The test also asserts it rendered at least 70 variants, because it walks a directory to find its work and a walk that finds nothing passes trivially.'
remedy:
- 'Eleven element classes given rules; the two mendacious comments made true.'
- 'A test pairing every emitted element class against a rule, over every variant of every block type.'
- 'Six no-op modifier classes removed rather than given empty rules.'
prevention: 'THE NEAR MISS IS THE MORE USEFUL HALF OF THIS RECORD. The first version of the test extracted declared classes by matching /\.([a-zA-Z][\w-]*)/ over the whole stylesheet, comments included. Its own explanatory comment named `.md__rail` as the example. Deleting the `.md__rail` RULE therefore left the test GREEN, because the prose explaining the rule satisfied the check that the rule existed. It was caught only because the negative control was run before committing, and it would have been invisible forever otherwise: the test would have passed, on a stylesheet where a class was mentioned and never defined, saying exactly what a working test says. So: A DECLARATION EXTRACTOR MUST STRIP COMMENTS. More generally, when a check reads a file to learn what has been declared, ask what part of that file is PROSE - because prose is where the thing being checked for gets described, and a check that cannot tell a description from a definition can be satisfied by describing it. That is the same defect as BREACH-0001 one level up: there, a token pin asserted an alignment in prose and nothing derived it. Here the prose would have satisfied the deriving.'
