id: BREACH-0009
at: 2026-07-31T00:20:00Z
by: jellytot
what_happened: 'Two things, and the first is the gate working rather than failing. (1) Commit 7effdb5 edited `crates/vds-store/src/lock.rs` at 20:20 on 2026-07-30, two hours and eleven minutes after that file was pinned at 18:09, and shipped with no re-pin. The next `vds lock verify` reported it: pinned sha256:eafb9844..., actual sha256:12ef5357.... So for the interval between that commit and this one, the enforcement lock asserted a digest for its own implementation that was not the digest in the tree. The edit itself was a strengthening - the failing-direction-test resolver matched only Rust `fn <name>(`, so it could never pass for a host project whose failing-direction tests are vitest `it(...)` or jest `test(...)`, which is a check that could not pass for the framework the host actually uses - and that is exactly why it was easy to ship without thinking about the pin. (2) The far worse one, mine, in the same sitting: appending the criteria-grader entry to `.vds/enforcement.lock` with an UNQUOTED bash heredoc. The rationale text contained backticks around `vds doctor --report-only` and `cargo test --workspace`. Bash treated them as command substitution, RAN `cargo test --workspace`, and wrote its stdout into the middle of the enforcement lock. The lock file was corrupted with roughly a hundred lines of test-runner output. MEASURED: `grep -c "test result" .vds/enforcement.lock` returned a non-zero count on the artefact that governs every gate in this repository.'
law_breached:
- 'VDS S-8(4) and S-12(3): a gate edited after it was pinned must be re-pinned in the same act, with a rationale, and self-filed. Commit 7effdb5 did none of the three.'
- 'The duty of reasonable skill and care (S-4..S-8): writing to the enforcement lock through a shell construct that can execute the content being written is not a reasonable way to edit a governance artefact.'
discovered_by: 'Working BREACH-0006 remedy item 3 (bring the criteria grader under a real gate). Running `vds lock verify` after adding the grader entry surfaced the 7effdb5 drift, which nothing else had looked for since that commit landed. The heredoc corruption was found in the same command output, because `lock verify` printed test-runner text that could only have come from inside the file it was reading.'
containment: 'BOTH CLOSED IN THIS COMMIT. The corrupted lock was restored with `git checkout .vds/enforcement.lock` and verified clean by the same grep that found it (0 occurrences of test-runner output, 16 entries intact). The append was redone with a QUOTED heredoc, which interprets nothing, and the digest substituted afterwards with sed over a placeholder so no expansion is needed inside the document at all. The drifted entry was re-pinned via `vds lock repin --rationale`, which recorded `supersedes_digest` and the reason, and the CLI itself then printed the instruction that produced this file: "a re-pin with a rationale and no breach report is a rationale nobody has to answer for."'
remedy:
- 'Re-pin crates/vds-store/src/lock.rs to the bytes in the tree, with the rationale recorded on the entry.'
- 'Never write to a governance artefact through an unquoted heredoc. A quoted heredoc plus a placeholder substitution has the same effect and cannot execute the document.'
- 'OPEN: nothing checks the enforcement lock for content that could not have been written by the writer. A corrupted lock is currently detected only because a human reads the verify output and notices it is printing test results. A structural parse would have refused the file outright; `lock verify` parsed around the damage and reported one unrelated drift, which is the worst of both - it looked like it had read the file successfully.'
prevention: 'Two rules from two different failures that happen to share a commit. FIRST, ON THE GATE: A GATE EDIT AND ITS RE-PIN ARE ONE ACT. Separating them by even a single commit leaves the lock asserting bytes that are not in the tree, and the window is invisible until someone runs verify - here it was over four hours and would have been longer had this work not touched the lock for another reason. That is the third time this repository has shipped a gate edit without a re-pin (BREACH-0003 was five gates at once), which means the discipline is not holding and the answer is mechanical: make the re-pin part of the same command that edits a gate, or make CI refuse a diff that touches a pinned path without touching the lock. SECOND, ON THE TOOLING: THE SHELL IS NOT A TEXT EDITOR. An unquoted heredoc executes its own content, so using one to write a file whose text contains backticks means the file writes whatever those commands print. The blast radius here was the single most load-bearing artefact in the repository, and the only reason it cost nothing is that the file was in git and the damage was loud. A quiet corruption - a substitution that produced an empty string instead of a hundred lines - would have left a lock that parsed, verified, and bound the wrong thing.'
