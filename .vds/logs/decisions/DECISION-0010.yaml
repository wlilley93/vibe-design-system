id: DECISION-0010
at: 2026-08-02T21:38:43Z
by: jellytot
decision: 'The R3 finding against .vds/court/FINDINGS-2026-08-02-a-count-is-not-a-contract.md is disposed by RESTATEMENT, not by an adjudicated collision: the quoted length literal in section 1 is named by class by its own author, the gate is untouched and no site is disposed.'
court_required: false
why: 'The tempting route was a third row in the ADJUDICATED table, and it is not open. [2026] VJS-FI-VDS 1 section VIII holds that the judgment authorises no adjudication beyond the two at order 5, that a future site needs a future ruling, and that it creates no general power in an engineer to dispose of a finding; order 11 gives liberty to apply where a third adjudication is sought. Writing a row citing order 5 would cite a ruling that never saw this site. It would also fail the mechanism''s own first bound: section V''s finding of fact is that the two readings of an adjudicable string are lexically identical, and the string here had ONE reading, a width utility quoted from the subscriber''s code and asserted by the sentence around it AS the width the code draws. That is a realisation under VDS S-2(4), and disposing of a real value is the ground order 11 names for returning to court. What the ruling actually prescribes is the lesser instrument: section VI''s ordering principle is that where an author may lawfully restate their own record, restatement disposes of the finding, and the court disposes of the site itself only where no lawful restatement exists. The jurisdictional bar that refused restatement for the two sites in the Court of Appeal''s text does not reach this document, which is the engineer''s own evidence and not a superior court''s judgment, and order 1 already made class-naming binding on every governance record under .vds/**, a submission and a findings document alike. So this is compliance with a standing order rather than a new dispensation. All four of section VI''s reasons transfer: the author is the party restating, the proposition is preserved entire because the finding always argued that the counts and the widths agree and the route is still not at parity, the technique is the one the gate''s own notes use, and nothing is destroyed because the original wording is in git under VDS S-4(5). A reviewer could disagree and prefer to leave the gate red pending a fresh sitting; the argument against is section I of the same judgment, which holds that a red count that rises with every lawful act of recording has no terminal state and leaks toward somebody taking the gate out. Measured: rows_enforced 726 and one fatal R3 finding before, rows_enforced 727 and zero violations after, with both existing adjudicated sites still disposed as warnings. The rule is intact; only the record moved.'
basis:
- VDS S-2(8)
- VDS S-2(4)
- VDS S-4(5)
- VDS S-12(2)
- '[2026] VJS-FI-VDS 1'
