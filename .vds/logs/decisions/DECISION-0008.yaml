id: DECISION-0008
at: 2026-08-01T13:23:45Z
by: jellytot
decision: 'Implementation of [2026] VJS-CA-VDS 1: the carried orders built, the ledger_staleness collision resolved by ADDING ARMS rather than moving defaults (order 39''s election), and the three uncarried Schedule B items this repository agreed with handled by their own routes rather than silently.'
court_required: false
why: 'Order 39 gave the implementer an election between adding staleness arms for the three new ledgers and moving their defaults out of the ledgers directory; I added the arms. A ledger belongs with the ledgers, and a default relocated to dodge a gate is the gate teaching the layout rather than the other way round - the same reasoning the frame and geometry ledgers already settled when each got an arm instead of a new home. The arm is deliberately SELF-CONSISTENCY ONLY and says so in its note, because currency for these three is settled per ledger elsewhere (geometry R12/R14, burndown R10, visual_review''s three populations) and an arm claiming more than it checks is the defect the R3/R4/R5 notes were written to avoid. SCHEDULE B, and this is the part a reviewer should test hardest: the coordinator''s brief listed the three-valued agreement bit as a defect to fix, and the judgment records it at Schedule B item 1 as NOT CARRIED, binding nothing and available to a future submission. Building it as enacted law would have been an instrument enforcing a rule no enactment carries, which is the exact fault the judgment names in the two-regimes reasoning. So it is BUILT and marked draft S-7A(5A) on the face of every rule that reads it, and filed as SUBMISSION-VDS-019 with its own case file - this lane''s standing posture, and the only route that closes the defect without inventing law. The other Schedule B items are recorded in .vds/court/2026-VJS-CA-VDS-1-schedule-b.md with what was done about each; items 6 and 8 are named there as live gaps rather than left to be rediscovered. A reviewer could disagree with two calls. First, the lock''s failingDirectionTest field keeps its old NAME while carrying a list, with a single object still deserialising: I chose that over a rename so every lock written before order 3 keeps loading and is rewritten on its next re-pin, at the cost of a field whose name is singular and whose value is plural. Second, order 20''s degrade is implemented as a per-rule guard inside visual_review rather than as a wrapper around the kind, so R1 and R6 could be left fatal per order 20''s express carve-out; a wrapper would have been tidier and would have degraded them too.'
basis:
- '[2026] VJS-CA-VDS 1 orders 1, 3, 39'
- VDS S-12(2)
