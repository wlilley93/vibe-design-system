id: DECISION-0006
at: 2026-07-31T17:14:03Z
by: jellytot
decision: Adopt golden bytes for the Figma drawing generator, classify a drift as emitter-moved or data-moved, and pin block-graph.js and figma-golden.js onto the site-factory gate surface (re-pinning tests/floors.js).
court_required: false
why: 'The third of four mechanisms borrowed from southleft/ds-contracts-poc. figma-draw.js was gated only on two runs being byte-identical, which catches an emitter that moves on its own and nothing else: an intended edit passes silently because both runs agree with each other and neither is compared with anything committed. That script writes to the live Figma file, so an unread change redraws 43 component sets. The golden is the literal emitted bytes rather than a digest, because a digest mismatch names no change and the review surface has to be git diff. A reviewer could disagree with two things. First, committing 20KB of generated script is duplication - answered: the duplicate IS the instrument, and a digest would leave a reviewer with two hexes and no way to see what a redraw would do. Second, the input digests could have been asserted rather than merely recorded - refused, because a comment edit that changes no emitted byte would then fail the gate, which is the cry-wolf failure and the reason people start updating a golden without looking at it. The re-pin of floors.js is not a weakening: the gate surface GREW by two files, and MIN_TESTS rose 118 to 119. THE DESIGN HAD A DEFECT AND THE SEED FOUND IT: the first version listed figma-draw.js among the classified inputs, which made the emitter_moved branch unreachable - editing the generator always moves its own digest, so every generator edit reported inputs_moved, "an ordinary consequence, read the diff", and the one case the classification exists to surface could never fire. The four in-test negative controls all passed over that, because they fabricate the digests they hand the classifier and so cannot see a defect in what FEEDS it. Only seeding a real edit into figma-draw.js and reading which branch answered caught it. The emitter digest is still recorded, and deliberately not classified on.'
basis:
- 'VDS S-7(2)(2): a gate must have a test that proves its failing direction, and a branch no input can reach has no failing direction to prove'
- 'VDS S-2(4): the emitted script binds variables by name and realises nothing, which the golden freezes as well as the emitter'
