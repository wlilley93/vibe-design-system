id: DECISION-0007
at: 2026-08-01T12:29:11Z
by: jellytot
decision: 'The reversible calls of lane feat/proof-kinds-visual-gap (2026-08-01): prohibition patterns are literal substrings; the burndown/prohibition/sign-off doors mirror the geometry door''s shapes; the measuredBy rules live in register_completeness; grace and deadline clocks read ledger moments, never the wall clock; the frames ledger gains a per-row content digest; figma_property/parity authority states are deferred; the six enactment proposals are DRAFTED in .vds/submissions/draft/ pending VJS filing.'
court_required: false
why: 'Each call is low-blast and reversible under the drafts they implement, and every irreversible-shaped question travels in the submissions instead. (1) Substring not regex: the regex failure modes (backtracking, silent widening) are the silent-scope defects S-7B exists to refuse; a regex flag can be added by amendment without unwinding anything. (2) Doors mirror geometry''s add/lower/deprecate: one interface idiom for directional artefacts, and vds burndown pin refuses to raise for the ratchet reason already enacted at S-7A(2). (3) register_completeness houses S-5(9) R2/R3 rather than a sixteenth kind: the rules read register rows, which is that proof''s input set; the scope-note widening is put to the bench in SUBMISSION-VDS-015 option 2 so the placement can be moved by ruling, not by archaeology. (4) Ledger-moment clocks keep findings a function of inputs (S-7(2)(1)); where the grace rule reads generated_at, that value is added to the inputs digest so it cannot move findings invisibly. (5) The per-row frame digest is Option and old ledgers resolve UNSIGNED fail-closed, so no existing artefact changes meaning. (6) Deferral of figma_property: the component ledger is file-scoped where sign-offs are frame-scoped; forcing the shape now would bind authority to the wrong granularity, and the deferral is named in SUBMISSION-VDS-012. (7) Drafts sit in submissions/draft with status draft and vjs_submission_id null because filing is the VJS front door''s act; a hand-asserted filed status would be a filing that never happened.'
basis:
- VDS S-12(2)
- draft S-7B/S-7C/S-7D, SUBMISSION-VDS-012..017
