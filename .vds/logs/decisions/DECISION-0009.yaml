id: DECISION-0009
at: 2026-08-01T13:27:41Z
by: jellytot
decision: no_stored_values now reports two findings against .vds/court/2026-VJS-CA-VDS-1-enactment.md (a build duration quoted in narrative prose at line 337, read as a duration literal, and a task ordinal that is also three hexadecimal digits at line 375, read as a colour literal). The gate is NOT weakened, the judgment is NOT edited, and the finding stands red until the court record's author disposes of it.
court_required: false
why: 'RESTATED under order 3 of [2026] VJS-FI-VDS 1, which ruled the restatement a RESTATEMENT and not a falsification. As first written this entry QUOTED both matched strings verbatim in order to say which two the gate was reporting, and both quotations landed under .vds/**, where the gate read them and reported them: the referral itself created two further findings and took the count from two to four. The original wording is in git. Nothing here is lost by naming the two by class, because the argument below was always about the class and never about the values. The court''s order 1 now makes that discipline binding on every governance record that discusses a realisation. --- Three courses were open and two of them are worse than a red gate. (1) EXEMPT .vds/court/** from the scan. Refused: the module''s own doctrine says prose is not exempt because VDS S-2(8) makes the test RECOVERABILITY rather than spelling, and that exempting prose-bearing artefacts is ''a hole with a name'' through which a realisation walks by being moved one field to the left. A judgment is the most prose-bearing artefact this repository has and would be the widest such hole. (2) EDIT THE JUDGMENT so the two strings no longer match. Refused: a court record is the record of what the bench said, and editing one to make a gate green is falsifying the record to satisfy the instrument that reads it - the precise inversion the whole lane exists against. Neither string is mine to restate. (3) LEAVE IT RED AND SAY SO. Taken. The gate is behaving exactly as enacted: both strings ARE realisation-shaped and both ARE recoverable from .vds/**, and the fact that one is a build time and the other a task number is a fact about the sentence and not about the shape. The disposition belongs to whoever authors court records - either the clerk restates the two values by class, as every note this proof writes already does, or the court rules that a judgment is a fact rather than a record for S-2(8) purposes, which is a submission and not a call I may make. A reviewer could reasonably disagree and prefer a narrow, counted carve-out for .vds/court/**; the argument against is that the carve-out''s name would be ''the directory where the reasoning lives'', which is where a value would most usefully hide.'
basis:
- VDS S-2(8)
- VDS S-12(2)
- '[2026] VJS-CA-VDS 1'
- '[2026] VJS-FI-VDS 1'
