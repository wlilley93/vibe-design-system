by: jellytot
keep_per_kind: 10
basis:
- 'VDS S-2(5) deletion limb: nothing downstream resolves against a passing, uncited, superseded proof record'
- 'VDS S-2(5) regeneration limb: a proof record is produced by a named command over a named subject and is regenerable by definition (VDS S-7(2)(1))'
- 'VDS S-6(3): a record cited by any warrant is never removed, whatever that warrant''s status'
- 'a failed record is never removed: a failure is an event, and a vacuity is a standing condition carried by the most recent record'
rationale: The proof directory is a WORKING SET over an append-only store. `.vds/` is committed, so every record named below remains at the commit that captured it and is reachable by `git log -- .vds/proofs/<id>.yaml`. Its id, kind, status and digest are recorded here, so which bytes went is answerable without git as well. 20 removed, 70 kept.
