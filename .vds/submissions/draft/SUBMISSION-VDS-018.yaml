fail_closed_interim: "ENACTMENT PENDING, and the interim is the implementation itself, marked as drafted on its face (every new rule cites 'draft S-7D(7)', '(8)', '(9)' or '(10)'). Fail-closed in three places: a run with NO manifest reports '[stage-4 coverage] UNKNOWN' and explicitly says it cannot state what it was supposed to cover, rather than reporting on the records it holds; an edited manifest REFUSES the run rather than shrinking the report; and an under-enumerated run refuses rather than publishing. A never-reviewed route is a named warning, not a failure, following [2026] VJS-SC-OPBOX 1 Q3, so adopting the kind cannot redden an estate on day one. No warrant may cite any of this before the ruling, and VDS is not commenced (S-15) so none can. DEFERRED, and named so it is not mistaken for done: the stage-1 contract JSON itself is not generated here - the engine checks that a verdict CITES a sign-off row and that the row covers the frame version compared against, which is the link; deriving the contract document from frame geometry is stage-1 work and belongs with the capture pipeline. PROCEDURAL: a bench is sitting on SUBMISSION-VDS-012 to -017, so this goes to the next sitting. DIGEST PROVENANCE: case_file_digest is derived by scripts/case-file-digest.sh over the evidence files named above, at drafting."
