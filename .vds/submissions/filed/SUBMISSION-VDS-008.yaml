id: SUBMISSION-VDS-008
status: filed
question: "Is the VDS component register the canonical artefact with any component CONTRACT derived from it, or should the register adopt a contract shape - specifically a per-prop binding carrying a Figma side AND a code side - as ds-contracts-poc does?"
trigger: first_impression
why_first_impression: |
  Nothing in the citator reaches the question of what shape a COMPONENT CONTRACT takes, or
  whether a binding between a Figma property and a code prop may be a bare name. The question
  became live because a published relative of VDS appeared in July 2026 (southleft/ds-contracts-poc,
  MIT) that answers it differently, and because a measurement against a third-party library
  showed my answer is insufficient on its own terms.
citator_checked:
  - citation: "[2026] VJS-CC-OPBOX 3"
    why_not_on_all_fours: |
      It fixes the storing/deriving line and names three systems of record, and this submission
      accepts both without reservation. What it does not reach is the SHAPE of a derived
      artefact: a binding carrying a code side stores no design value, so the storing/deriving
      line does not decide it.
  - citation: "[2026] VJS-CC-RECORD-PROJECTION 9"
    why_not_on_all_fours: |
      This is the nearest, and the distinction is precise. Its ratio is that "a file whose
      content is WHOLLY CONTAINED in another, and which is generated by serialising a struct
      parsed FROM that other, is a projection and not a second claim on the citation". The
      precondition is containment. A ds-contracts contract is NOT wholly contained in a
      ComponentRecord: it carries an anatomy block of TOKEN REFERENCES, a per-value
      canonical-to-canvas spelling map, and a code-side binding, none of which the register has
      ever held. CORRECTED 2026-07-31, AGAINST MY OWN DISTINCTION: this said "an anatomy part
      TREE", and measurement shows the shipped corpus has no tree at all - all 51 contracts have
      exactly ONE part, named `root`. The distinction survives on the other two limbs and on the
      264 token references, but it is weaker than as filed, and the bench should have the smaller
      version rather than the one that flatters the argument. So the
      "do not store a derived thing beside the record and treat it as an independent
      authority" ratio does not fire, and the question of which is the record is open.
  - citation: "[2026] VJS-CC-OPBOX 1"
    why_not_on_all_fours: "The locus ratio fixes where a domain lives. Both candidates live in the same place."
options:
  - option: "REGISTER CANONICAL, contract derived. Keep `figmaProperty` as a bare name."
    consequence: |
      REFUTED BY MEASUREMENT, and this is the finding that prompted the submission. Simple
      Design System models `Has Icon` (BOOLEAN) + `Icon` (INSTANCE_SWAP) IDENTICALLY on Button
      and on NavigationButton. In code, Button has no icon prop and takes icons as positional
      CHILDREN; NavigationButton has a real `icon?: ReactNode` PROP. The Figma side is the same
      and the code side differs, so THE CODE SIDE IS NOT DERIVABLE. A bare name cannot express
      it and neither can a name plus a KIND. Measured on a library nobody here wrote.
  - option: "REGISTER CANONICAL, and the binding grows a code side (adopt the SHAPE, not the tool)."
    consequence: |
      `figmaProperty: Option<String>` becomes a binding carrying the Figma property, its kind,
      a value map that may be PARTIAL, and the code prop it drives. Costs a schema change and a
      migration of every record. Keeps warrants, breaches, the enforcement lock, vacuity
      accounting and the amendment ledger, none of which ds-contracts attempts. AGAINST: the
      register would be converging on ds-contracts' shape one field at a time without the
      emitters, extraction adapters or conformance fixture that make that shape pay - the cost
      of their model with none of its generation.
  - option: "CUT OVER: adopt the ds-contracts contract as the record, keep VDS as a checker."
    consequence: |
      Discards the reason the programme exists. Their whole a11y surface is three optional
      scalars, one of which no emitter reads, so BREACH-0001 - a control boundary at 1.15:1
      across five themes - is invisible to it. Their own ledger also undercuts it: "No library
      in this repo is captured past 11.9%", and their committed parity report reads total 0
      over a snapshot 23 days past its own freshness gate.
  - option: "Adopt Custom Elements Manifest as the contract format."
    consequence: |
      Already refused as a decisive call, recorded here so the court can disturb it. The
      vendored CEM schemas have NO field for variants, a11y role, accessible name, keyboard
      behaviour or design tokens, and the 2.1.1 speculative draft adds none. It is also
      GPL-3.0.
evidence:
