  - "site-factory/vendor/sds-figma-contract.json - the Figma half, harvested with a negative control run first"
  - "site-factory/figma-variants.json - all 43 own blocks classified: 31 aligned, 1 subset, 11 different_axis"
  - "site-factory/docs/DESIGN-TWIN.md - the design twin argument and the five measured gaps"
  - "site-factory/vendor/ds-contracts-harvest.json - the subject, MEASURED and committed: 51 contracts at commit f3b9bbf3aed6a0d09a8af98b6c2c9c06f2c25dd8, 113 props each carrying BOTH a Figma and a code binding, and 264 of 264 anatomy token values being REFERENCES with zero literals. Replaces a bare pointer to /var/tmp/claude/refs/ds-contracts-poc, which was a clone in a disposable directory that could vanish between filing and ruling. The clone is still the source; it is no longer the evidence."
  - ".vds/logs/breaches/BREACH-0001.yaml - the founding defect the a11y surface must be able to catch"
