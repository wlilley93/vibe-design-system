answer:
  citation: "[2026] VJS-CA-VDS 1"
  ratio: >-
    ENACTED AS AMENDED on option 1 by two to one, Estate J dissenting for option 2. Order 17 is itself the ruling option 2 waits for, and a doctrine repealed for some instruments and retained for others is one rule and a disagreement. CORRECTED ON THE RECORD (order 24): screen_parity carries NO acceptance surface, both options asserted one, and the consequence clause directing its removal is STRUCK as a direction reaching nothing - the surface the doctrine occupies is the consuming repository's richness pin and its fifteen accepted-over rows. AMENDED by orders 25-33: three resolution routes replace the drafted single route; the register grows a DirectionRecord row kind hash-bound to its logged decision; RedrawStatus grows `parked`; the repeal is executed as a MIGRATION and never a deletion; the front door refuses a frame that disclaims its own currency; and the register is a condition precedent, the flip from report to block being per surface.
