reserved_clause: "S-4(6), S-7E"
fail_closed_interim: "ENACTMENT PENDING, and the interim is the implementation itself, marked as DRAFTED on its own face: every rule cites 'draft S-7E(n)', the artefact section is headed DRAFTED, and the proof's establishes-line says so. Fail-closed in four places. (1) An intent root resolving under `.vds/` is refused at config LOAD and again inside the proof, because one gate on one artefact is one place it can be removed. (2) A frame ledger stating no CAPTURE DATE refuses the bypass rule rather than reporting no bypass, so adopting the kind cannot produce a quiet green over a stale reading. (3) A frame with no baseline is UNSCORED and named, never a pass and never a violation, so no estate is reddened on adoption. (4) `vds stage plan` refuses to emit against a refused gate, so a refusal cannot end up downstream of the act it exists to stop. NOT BUILT, and named so it is not mistaken for done: the write leg itself is unexercised. It needs the live plugin bridge, which this engine does not hold and which VDS S-7(2)(1) keeps out of the proof path anyway; the diff and the plan emission are proven against fixture frame readings, including the two idempotence seeds, and the network leg is honest debt. DIGEST PROVENANCE: case_file_digest is derived by scripts/case-file-digest.sh over the evidence files named above, at drafting."
