answer:
  citation: "[2026] VJS-CA-VDS 1"
  ratio: >-
    ENACTED UNAMENDED on option 1, two of three judges requiring no amendment so the narrowest position commanding a majority is enactment as drafted. The recorded-expansion rule and the vacuity refusals stand; the regex option is refused because an unescaped dot that silently widens a match is the very silent-scope defect the kind exists to refuse. Order 2 attaches; SC-OPBOX 1 order 24 does not reach a directive proof. Engine J's sitesAtRegistration amendment is Schedule B item 4.
  answered_at: 2026-08-01T13:00:00Z
