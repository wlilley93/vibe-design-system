id: SUBMISSION-VDS-001
status: filed
question: "May W1 REGISTER-COMPLETE be granted provisionally on a greenfield surface?"
trigger: first_impression
why_first_impression: "No authority reaches the greenfield case. W1-before-design is what makes drift structurally impossible, and it may also be impossible to satisfy on a surface where the register cannot be completed without designing first."
citator_checked:
  - citation: "[2026] VJS-CC-OPBOX 3"
    why_not_on_all_fours: "It fixes the storing/deriving line for a token kernel and names the systems of record. It does not reach this question."
  - citation: "[2026] VJS-CC-OPBOX 1"
    why_not_on_all_fours: "The locus ratio fixes where a domain lives, not how a design warrant is earned."
options:
  - option: "strict W1, as now"
    consequence: "a greenfield surface cannot lawfully start, because the register cannot be completed before the design that determines it"
  - option: "a provisional registration that design may use and W1 later ratifies"
    consequence: "the obvious relief, and a hole large enough to drive the whole mechanism through: everything becomes provisional"
  - option: "W1 granted over a DECLARED SUBSET, with the subset named by digest"
    consequence: "keeps the ordering and bounds it, at the cost of a second surface concept"
evidence:
  - "VDS.md, the clause named in reserved_clause"
  - "docs/GOAL.md, the done criterion the clause bears on"
case_file_digest: sha256:c6323a412d72bd532d5d1b6bff1d06ee8ac953d734247d6a32693be6b18d8299
reserved_clause: "S-6(5)"
fail_closed_interim: "DIGEST PROVENANCE: case_file_digest is derived by `scripts/case-file-digest.sh VDS.md docs/GOAL.md`, the two files this submission's evidence names. Submissions 001 through 006 share it because they share a case file: each is a question about how the specification reads, decided on the specification and the goal statement. All six carried sixty-four zeros from filing until 2026-07-31 - a placeholder that reads exactly like a computed digest, so six pending questions were all awaiting a ruling on a record that could move under them with nothing saying so. no provisional registration exists and W1 is strict"
filed_to: vjs
vjs_submission_id: SUBMISSION-2026-07-31-190904
created_at: 2026-07-25T13:00:00Z
filed_at: 2026-07-25T13:00:00Z
answer:
  citation: "[2026] VJS-CC-VIBE-DESIGN-SYSTEM 4"
  ratio: >-
    W1 REGISTER-COMPLETE may be granted over a DECLARED SUBSET named by digest in the grant itself; design proceeds inside the subset, touching a record outside it is uncovered work, and widening the subset is a new grant. A provisional grant awaiting ratification is forbidden: deferred enforcement is banked debt and nothing forces the ratification.
  answered_at: 2026-07-31T19:16:00Z
