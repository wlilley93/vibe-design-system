reserved_clause: "S-7A(4)"
fail_closed_interim: "No Figma-derived reading is written to `.vds/ledgers/` and none is passed to `vds ledger geometry --from`. The measurements taken of the Figma side live in `site-factory/vendor/` as vendored measurements with their own guards, outside the proof surface entirely, so nothing in the governance record currently rests on one."
