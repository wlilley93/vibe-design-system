id: SUBMISSION-VDS-005
status: filed
question: "Where does the primitive floor sit for the composition proof: is a bare HTML element in a screen an unregistered component?"
trigger: first_impression
why_first_impression: "The answer changes how much of the codebase the anti-drift proof reaches, so it must not be settled by whichever choice makes the first run pass."
citator_checked:
  - citation: "[2026] VJS-CC-OPBOX 3"
    why_not_on_all_fours: "It fixes the storing/deriving line for a token kernel and names the systems of record. It does not reach this question."
  - citation: "[2026] VJS-CC-OPBOX 1"
    why_not_on_all_fours: "The locus ratio fixes where a domain lives, not how a design warrant is earned."
options:
  - option: "bare elements are informational, as now"
    consequence: "the proof reaches the component layer only, and a screen built entirely from bare elements satisfies it while proving nothing"
  - option: "every bare element is an unregistered component"
    consequence: "total reach, and every div fails until the register holds a record for div"
  - option: "an enumerated set of elements is below the floor"
    consequence: "the useful middle, and the enumeration is itself a design decision nobody has made"
