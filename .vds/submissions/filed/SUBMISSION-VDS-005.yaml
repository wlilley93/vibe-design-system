answer:
  citation: "[2026] VJS-CC-VIBE-DESIGN-SYSTEM 5"
  ratio: >-
    An ENUMERATED SET of elements sits below the composition floor, held as a governed artefact a reader can disagree with. Everything outside the set is a registered component or a named carve-out. Failing bare elements wholesale is the cry-wolf failure and is forbidden; leaving the floor unstated is refused. Changes to the set are ordinary governed edits.
  answered_at: 2026-07-31T19:17:00Z
