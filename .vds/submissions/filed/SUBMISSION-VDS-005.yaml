fail_closed_interim: "DIGEST PROVENANCE: case_file_digest is derived by `scripts/case-file-digest.sh VDS.md docs/GOAL.md`, the two files this submission's evidence names. Submissions 001 through 006 share it because they share a case file: each is a question about how the specification reads, decided on the specification and the goal statement. All six carried sixty-four zeros from filing until 2026-07-31 - a placeholder that reads exactly like a computed digest, so six pending questions were all awaiting a ruling on a record that could move under them with nothing saying so. composition reports bare elements as informational rows, counted in rows_considered and excluded from rows_enforced, and any warrant relying on it says so"
