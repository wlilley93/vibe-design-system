answer:
  citation: "[2026] VJS-CA-VDS 1"
  ratio: >-
    ENACTED AS AMENDED on option 1. The unre-pinned-decrease rule is the whole difference between a burndown and a ratchet and stands. AMENDED by order 13: a record carrying a deadline MUST declare a maximum reading age, and the proof is fatal where the reading precedes the run's freshest independent input by more than that - a deadline measured only against the input it gates is a deadline the subject sets. S-7C(3)'s measurement against the reading's own moment is otherwise undisturbed (order 14). Engine J's inputs/sourceDigest and re-based clock are Schedule B item 5.
  answered_at: 2026-08-01T13:00:00Z
