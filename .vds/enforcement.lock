  relock_rationale: 'Two gate edits shipped without re-pins, both legitimate strengthenings that rode along in commits about other subjects. (1) crates/vds-cli/src/doctor.rs, edited in 78f196a: D2 asked the failing-direction question with a matcher that could not pass, so the criterion could never report the failure it existed to find. (2) crates/vds-store/src/lock.rs, edited in 3fd5a7d: test_name_resolves was made public because the same question is asked in two places and was answered in only one. Neither weakened a gate; both were shipped in a commit whose subject line named something else, which is exactly how a pinned path gets edited without anyone thinking about the pin. Self-filed as BREACH-0011, which records this as the third and fourth occurrence of the pattern after BREACH-0003 and BREACH-0009, and treats the recurrence as evidence that the discipline does not hold and the remedy must be a program.'
