  supersedes_digest: sha256:09d3675cb7df56e57e39fce8f1f76b7becdc4280c56725fe350bba6924574d85
  relock_rationale: 'no_stored_values R8: a hex candidate that is a segment of a hyphenated or underscored identifier is skipped - the gate failed the build on its own capture clock (a six-digit HHMMSS time, hex-decoded, read as a one-character duration). The first fix (skip all-digit tokens) was killed by the seeded R8 test in one run: the hex encoding of the seeded grey colour literal is pure digits (the hash mark and the letters a to e all encode to digit-only pairs), so position, not digit purity, is the discriminator. The incident is seeded as its own passing test beside the colour test that keeps the carve-out honest. Also the ceiling gains a test binding its D2 claim to SUBMISSION-VDS-010 answer.citation, after the doc kept calling a decided question open with no test tripping.'
