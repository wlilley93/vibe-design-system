  supersedes_digest: sha256:5628df4003d75f42e828f4980b812bd7d182b087c0ba0faf23bd3f847293a988
  relock_rationale: 'Re-pinned under order 8 of [2026] VJS-FI-VDS 1, which held that a court record filed under .vds/court/ is within the reach of VDS S-2(8), that limb 1 is a shape FLOOR and not a sufficient test of the storing form, that no tightening of the matcher exists because the two readings of such a string are lexically identical, and that a judge at first instance has no power over a superior court''s text. The gate gains the ADJUDICATED COLLISION: one court, one file, one digest, one line, one column, one limb 1 shape class, reported as a warning naming the ruling and counted on the face of the record, dying when the artefact moves and fatal when it disposes of nothing, and reaching only the three classes whose spellings collide with ordinary prose. Two sites are adjudicated, both in the Court of Appeal enactment judgment, on the VDS S-2(5) analysis at section IV of the ruling. Three seeded controls are added and named above, because a narrowing without a control is a gate switched off. Only this entry is re-pinned: three other gates carry drift that predates this change and is not this ruling''s to launder. PRIOR RATIONALE, kept because a re-lock that overwrites the reason for the last one leaves a warrant citing wording nobody can retrieve - no_stored_values R8: a hex candidate that is a segment of a hyphenated or underscored identifier is skipped - the gate failed the build on its own capture clock (a six-digit HHMMSS time, hex-decoded, read as a one-character duration). The first fix (skip all-digit tokens) was killed by the seeded R8 test in one run: the hex encoding of the seeded grey colour literal is pure digits (the hash mark and the letters a to e all encode to digit-only pairs), so position, not digit purity, is the discriminator. The incident is seeded as its own passing test beside the colour test that keeps the carve-out honest. Also the ceiling gains a test binding its D2 claim to SUBMISSION-VDS-010 answer.citation, after the doc kept calling a decided question open with no test tripping.'
