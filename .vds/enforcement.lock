  relock_rationale: 'cargo fmt --all reflowed doctor.rs after the D4 third-limb change in this same commit. No logic moved: the only diff against the digest pinned moments earlier is whitespace and line wrapping applied by the formatter, which `make check` runs as its first step and which therefore reaches every pinned Rust gate. Recorded rather than folded silently into the previous rationale, because a re-pin whose reason is "the formatter touched it" is a different fact from a re-pin whose reason is "the gate changed", and a reader who cannot tell them apart cannot audit the lock. Part of BREACH-0011 remediation.'
