  relock_rationale: 'The R11/R12 figmaProperty limb was added to this gate. It STRENGTHENS: no rule was removed, no threshold relaxed, and the named failing-direction test is unchanged and still passes. What it adds is a comparison the gate previously declared out of reach IN PROSE, a prop''s legal values against the legal values of the Figma variant property it names, which became reachable when the figma ledger started carrying variant options while nothing updated the note saying it could not be done. The new limb is UNDECIDED by default and counts every undecided comparison out loud, so a project whose props are not closed unions gains findings rather than failures. Re-pinned in the commit that changed the gate, per VDS S-8(4).'
