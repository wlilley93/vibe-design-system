  relock_rationale: 'Implement [2026] VJS-CC-VIBE-DESIGN-SYSTEM 5 D2 (task #49): composition gains R4 and the enumerated primitive floor BELOW_THE_FLOOR, held in this gate source so a change to the set is itself a re-pin. Interactive elements above the floor fail by name unless named in [surface] element_carveouts, every carve-out use counted and reported per site. The run printer gains the INFORMATIONAL section that inform() call sites always promised - recorded findings were never printed. Both failing directions, the carve-out path and the below-floor negative control are seeded in the gate tests.'
