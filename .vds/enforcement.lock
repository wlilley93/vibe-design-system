  relock_rationale: 'SUBMISSION-VDS-020: two gates re-pinned for the sixteenth kind, and NO RULE OF EITHER CHANGED. contrast.rs: three helpers - custom_property, recorded_ratio and redacted - became pub(crate) so staged_write G1 measures a staged boundary through the SAME code contrast measures a registered one. Copying them would have been two copies of one rule, which is one copy and a disagreement, and the disagreement would have been about which findings repeat a value they refused. screen_parity.rs: Coverage::line gained line_for(subject), which the sixteenth kind calls with its own subject; line() now delegates to it with the words it always printed. One arithmetic and one check_against, borrowed rather than reimplemented, because two coverage types are two chances to disagree about what scored counts - which is the failure that type exists to make visible one level down.'
