  failing_direction_test:
    path: crates/vds-proof/src/geometry.rs
    test_name: geometry_fails_when_the_bound_only_ever_held
    seeds: 'a bound that fell from 667 to 561 and then stood for 71 days against a 30-day window, over a reading it is otherwise comfortably under. The subscriber project''s own instrument, reproduced: R2 and R7 are both satisfied and the row still fails, because the direction is the rule. A seed that merely put the count over the bound would have proven a threshold, which a ratchet already had.'
  pinned_at: 2026-07-31T10:22:00Z
  pinned_by: jellytot
  supersedes_digest: sha256:6ec91decb1aab9af2367baf7735d15e062ea84fe234f7d2df98f13b753bae359
  relock_rationale: 'R10 was added: the reading must match its own content digest. The gate was pinned before the reading carried one, so a bound being exceeded could be brought back inside it by editing an integer in a YAML file and this proof would report a pass. STRENGTHENS: no rule removed, no threshold relaxed, one refusal added, and the named failing-direction test is unchanged and still passes. Re-pinned in the commit that changed the gate, per VDS S-8(4).'
