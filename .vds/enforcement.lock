  relock_rationale: 'Carried orders of [2026] VJS-CA-VDS 1 (enactment of the visual-gap proof kinds). Each of the three is a gate change the judgment ORDERED, not a drift discovered afterwards: crates/vds-cli/src/lock.rs implements orders 3 and 38 (failing_direction_tests becomes a LIST, repeatable --seed, verify and doctor resolve every recorded control); crates/vds-proof/src/geometry.rs implements orders 6 to 9 (a required comparator plus comparatorDigest inside the content digest, R14 comparator-stale fatal, W3 unpinned-comparator warning); crates/vds-proof/src/ledger_staleness.rs implements the order 39 election (R7 arms for the three new ledgers rather than moving defaults). Re-pinned as a set ONLY because the drifting set is exactly the set that judgment ordered and nothing else drifts: [2026] VJS-FI-VDS 1 declined to repin these under ITS citation precisely because that citation never considered them, and that reasoning is honoured here by citing the judgment that did. VDS S-8(4), S-12(3).'
